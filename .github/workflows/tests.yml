name: Verify output and test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, target]

jobs:
  dist_not_tracked:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Ensure distribution files are not tracked
      run: |
        tracked_dist_files="$(git ls-files -- dist/)"
        if [[ -n "$tracked_dist_files" ]]; then
          echo "::error::dist/ contains tracked files; distribution files must be published as release assets"
          echo "$tracked_dist_files"
          exit 1
        fi

  test:
    strategy:
      fail-fast: true
      matrix:
        test: [test_unit, test_integration, vet_schema]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 # v1.267.0
      with:
        bundler-cache: true
        working-directory: dev
    - uses: cue-lang/setup-cue@a93fa358375740cd8b0078f76355512b9208acb1 # v1.0.1
      with:
        version: 'v0.7.0'
    # Integration and schema checks validate generated output, not committed
    # files. Remove the checked-out dist/ tree so checks cannot accidentally
    # read committed or stale files, then generate a fresh ephemeral tree from
    # data/ and VERSION. Unit tests do not consume dist/.
    - name: Generate distribution files
      if: matrix.test != 'test_unit'
      working-directory: dev
      run: |
        rm -rf ../dist
        bundle exec bin/product_taxonomy dist --locales en
    - name: Run tests
      working-directory: dev
      run: |
        if [ "${{ matrix.test }}" = "test_integration" ]; then
          bundle exec rake test:integration
        elif [ "${{ matrix.test }}" = "test_unit" ]; then
          bundle exec rake test:unit
        else
          bundle exec rake schema:vet
        fi

  orphan_detection:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: ruby/setup-ruby@d5126b9b3579e429dd52e51e68624dda2e05be25 # v1.267.0
      with:
        bundler-cache: true
        working-directory: dev
    - name: Run orphan detection tests
      working-directory: dev
      run: bundle exec rake test:orphan

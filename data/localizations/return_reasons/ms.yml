      description: Produk kehilangan kelembapan terlalu awal sehingga menjejaskan
        kebolehgunaan.
      name: Mengering
    straps_too_thin:
      description: Tali tidak cukup lebar untuk memberikan keselesaan atau sokongan.
      name: Tali terlalu nipis
    messy:
      description: Penggunaan produk menyebabkan keadaan bersepah atau meninggalkan
        sisa yang tidak diingini.
      name: Menyebabkan keadaan bersepah
    hardness:
      name: Kekerasan
      description: Keupayaan bahan untuk menahan pemampatan atau tekanan pada permukaan
        tidak seperti yang dijangkakan.
    sturdiness:
      description: Struktur item tidak sekukuh yang dijangkakan, terasa rapuh, lemah
        atau mudah bengkok dalam penggunaan biasa.
      name: Kekukuhan
    fastening:
      description: Kaedah mengikat atau menutup item sukar digunakan atau tidak kukuh.
      name: Pengikat
    burn_time:
      name: Tempoh pembakaran
      description: Tempoh pembakaran item lebih singkat atau lebih lama daripada yang
        dijangkakan.
    support:
      description: Item tidak memberikan sokongan atau pengukuhan struktur yang mencukupi
        untuk badan.
      name: Sokongan
    filtration_class:
      description: Kadaran atau piawaian penapis untuk menyekat zarah tidak memenuhi
        keperluan.
      name: Kelas penapisan
    bust_too_small:
      description: Bahagian dada pakaian terlalu kecil untuk badan pelanggan.
      name: Bahagian dada terlalu kecil
    cuff_too_small:
      description: Bukaan untuk pergelangan tangan atau lengan terlalu ketat.
      name: Bukaan lengan terlalu kecil
    sweetness:
      description: Kandungan gula atau tahap kemanisan produk tidak menepati cita
        rasa pelanggan.
      name: Kemanisan
    portion_size:
      description: Jumlah makanan dalam satu hidangan terlalu sedikit atau terlalu
        banyak.
      name: Saiz hidangan
    mesh_size:
      name: Saiz jejaring
      description: Bukaan pada jaring atau penapis terlalu besar atau terlalu kecil.
    brightness:
      name: Kecerahan
      description: Keamatan cahaya yang dipancarkan atau dipantulkan oleh item tidak
        sesuai dengan kehendak pelanggan.
    poor_stitching:
      name: Jahitan tidak berkualiti
      description: Jahitan kelihatan kurang berkualiti, tidak sekata atau senget,

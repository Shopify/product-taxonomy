      description: Materialaren biguntasuna edo kolpeak moteltzeko gaitasuna ez da
        aurreikusitako erabilerarako espero zena.
      name: Kolpeen moteltzea
    spin_time:
      description: Produktuak espero baino denbora gutxiago irauten du mugimenduan.
      name: Biraketa-denbora
    tread_type:
      description: Produktuaren kanpoko zolaren edo gainazalaren marrazkia edo diseinua
        ez da egokia aurreikusitako lurzoru edo baldintzetarako.
      name: Errodadura mota
    suction:
      name: Xurgapena
      description: Produktuak sortzen duen hutsaren indarra ez da egokia aurreikusitako
        erabilerarako.
    difficult_to_adjust:
      name: Doitzeko zaila
      description: Produktuaren doikuntza edo ezarpenak aldatzeko mekanismoak erabiltzeko
        zailak dira.
    optic_didnt_fit:
      name: Osagarri optikoa ez da egokitzen
      description: Osagarri optikoa ez da behar bezala lotzen gailura.
    pet_refused:
      description: Animaliak ez du produktua kontsumitu edo erabili nahi, ezta harekin
        aritu ere.
      name: Maskotak ez du onartu
    ordered_wrong_format:
      name: Formatu okerra eskatu da
      description: Bezeroak produktuaren aldaera edo konfigurazio okerra hautatu du.
    too_rich:
      name: Astunegia
      description: Zaporea biziegia edo trinkotasuna astunegia da bezeroaren gusturako.
    doesnt_apply_evenly:
      name: Ez da uniformeki aplikatzen
      description: Produktua aplikatzean orbanak edo marrak geratzen dira.
    heel_too_low:
      description: Takoia bezeroak nahi baino baxuagoa da.
      name: Takoi baxuegia
    quality:
      name: Kalitatea
      description: Produktuaren kalitate orokorrak edo lanketak ez ditu itxaropenak
        betetzen.
    waist_too_small:
      name: Gerrialdea txikiegia
      description: Gerrialdearen neurria bezeroaren gorputzak behar duena baino txikiagoa
        da.
    footbed_too_deep:
      description: Oina kokatzeko hutsunea sakonegia da.
      name: Barne-zola sakonegia
    damaged_after_washing:
      description: Produktua garbitzean hondatu da.
      name: Garbitu ondoren hondatuta
    dried_out:
      description: Produktuak hezetasuna behar baino lehenago galdu du, eta horrek
        erabiltzeko gaitasunari eragiten dio.
      name: Lehortuta
    straps_too_thin:
      description: Tiranteak ez dira behar bezain zabalak erosotasuna edo euste egokia
        emateko.
      name: Tirante meheegiak
    messy:
      description: Produktua erabiltzeak nahi gabeko zikinkeria sortzen du edo nahi
        ez diren hondarrak uzten ditu.
      name: Zikindu egiten du
    hardness:
      name: Gogortasuna
      description: Materialaren konprimatzearekiko edo gainazaleko presioarekiko erresistentzia
        ez da espero bezalakoa.
    sturdiness:
      description: 'Produktuak ez du espero zen egitura-sendotasuna: hauskorra edo
        ahula dirudi, edo erraz okertzen da ohiko erabileran.'
      name: Sendotasuna
    fastening:
      description: Produktua lotzeko edo ixteko modua zaila da edo ez da segurua.
      name: Lotzeko sistema
    burn_time:
      name: Errekuntza-denbora
      description: Produktuak espero baino denbora gutxiago edo gehiago irauten du
        piztuta.
    support:
      description: Produktuak ez dio gorputzari behar adinako euskarri edo sendogarririk
        ematen.
      name: Euskarria
    filtration_class:
      description: Iragazkiaren partikulak blokeatzeko sailkapenak edo estandarrak
        ez ditu eskakizunak betetzen.
      name: Iragazketa-klasea
    bust_too_small:
      description: Jantziaren bularraldea txikiegia da bezeroaren gorputzerako.
      name: Bularralde txikiegia
    cuff_too_small:
      description: Eskumuturrerako edo besorako irekidura estuegia da.
      name: Eskumuturrekoa txikiegia
    sweetness:
      description: Produktuaren azukre-maila edo gozotasuna ez da bezeroaren gustukoa.
      name: Gozotasuna
    portion_size:
      description: Errazio bakarrean ematen den janari kantitatea txikiegia edo handiegia
        da.
      name: Anoaren tamaina
    mesh_size:
      name: Sare-begiaren tamaina
      description: Sarearen edo bahearen zuloen arteko tartea handiegia edo txikiegia
        da.
    brightness:
      name: Distira
      description: Produktuak igortzen edo islatzen duen argiaren intentsitatea ez
        da bezeroaren gustukoa.
    poor_stitching:
      name: Jostura eskasa
      description: Josturak nabarmen eskasak, irregularrak edo okerrak dira, eta fabrikazio-akats
        bat dagoela adierazten dute.
    smears:
      name: Zabaldu eta zikindu egiten du
      description: Produktua soinean eramatean edo erabiltzean, zabaldu edo lausotu
        egiten da, edo dagokion lekutik mugitzen da.
    magnification:
      name: Handipena
      description: Produktuak eskaintzen duen handitze optikoaren maila ez da egokia
        bezeroaren beharretarako.
    too_fine:
      description: Gainazal urratzailea behar baino leunagoa da edo behar baino gutxiago
        urratzen du.
      name: Xeheegia
    calibration:
      name: Kalibrazioa
      description: Gailua estandar ezagun baten arabera konfiguratzea edo doitzea
        zaila da, edo prozesuak ez du espero bezala funtzionatzen.

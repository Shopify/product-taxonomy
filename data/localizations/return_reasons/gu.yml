      description: જાળ કે જાળીનાં છિદ્રો વચ્ચેનું અંતર ખૂબ વધારે કે ખૂબ ઓછું છે.
    brightness:
      name: તેજ
      description: આઇટમમાંથી નીકળતા કે પરાવર્તિત થતા પ્રકાશની તીવ્રતા ગ્રાહકની પસંદ
        મુજબ નથી.
    poor_stitching:
      name: નબળી સિલાઈ
      description: સિલાઈ દેખીતી રીતે નબળી, અસમાન કે વાંકી છે, જે બનાવટની ખામી દર્શાવે
        છે.
    smears:
      name: ફેલાઈને લિસોટા પડે છે
      description: ઉપયોગ દરમિયાન પ્રોડક્ટ ફેલાય છે, ઝાંખી પડે છે કે લગાવેલી જગ્યાએથી
        ખસી જાય છે.
    magnification:
      name: મોટું દેખાડવાની ક્ષમતા
      description: આઇટમથી દૃશ્ય જેટલું મોટું દેખાય છે તે ગ્રાહકની જરૂરિયાતને અનુરૂપ
        નથી.
    too_fine:
      description: ઘસવાની સપાટી જરૂર કરતાં વધુ સુંવાળી છે અથવા પૂરતી ઘસાતી નથી.
      name: ખૂબ બારીક
    calibration:
      name: કેલિબ્રેશન
      description: ઉપકરણને નિર્ધારિત ધોરણ મુજબ સેટ કરવું કે ગોઠવવું મુશ્કેલ છે અથવા
        આ પ્રક્રિયા અપેક્ષા મુજબ કામ કરતી નથી.

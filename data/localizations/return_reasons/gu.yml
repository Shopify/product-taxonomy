      description: પ્રોડક્ટથી ત્વચા, વાળ અથવા અન્ય સપાટી અનિચ્છનીય રીતે સૂકાઈ જાય
        છે.
    too_loose:
      name: ખૂબ ઢીલું છે
      description: આઇટમ બરાબર ફિટ થતી નથી અથવા તેમાં પૂરતો તાણ નથી.
    refraction:
      name: વક્રીભવન
      description: લેન્સથી પ્રકાશનું વક્રીભવન થતાં ઇચ્છિત દૃશ્ય અસર મળતી નથી.
    weight:
      description: આઇટમ ભારે કે હલકી હોવાથી ગ્રાહકના ઇચ્છિત ઉપયોગ માટે યોગ્ય નથી.
      name: વજન
    diameter:
      name: વ્યાસ
      description: ગોળ આડછેદનો વ્યાસ જરૂરી ઉપયોગ માટે યોગ્ય નથી અથવા અન્ય ભાગો સાથે
        બંધબેસતો નથી.
    too_coarse:
      description: ઘસવા માટેની સપાટી જરૂર કરતાં વધુ ખરબચડી છે અથવા વધુ પડતું ઘસે છે.
      name: ખૂબ ખરબચડું
    odor_control:
      name: દુર્ગંધ નિયંત્રણ
      description: દુર્ગંધ રોકવાની અથવા દૂર કરવાની આઇટમની ક્ષમતા ગ્રાહકની જરૂરિયાતો
        માટે પૂરતી નથી.
    protection:
      description: આઇટમ આઘાત અથવા હવામાનની અસરોથી પૂરતું રક્ષણ આપતી નથી.
      name: રક્ષણ
    movement:
      name: હલનચલન
      description: આઇટમની સ્વચાલિત કે બાહ્ય બળથી થતી હલનચલન ખૂબ ઝડપી, ખૂબ ધીમી કે
        અન્ય રીતે અસંતોષકારક છે.
    ordered_multiple:
      name: એક કરતાં વધુ મંગાવી
      description: ગ્રાહકે માત્ર એક રાખવાના હેતુથી ઘણા વિકલ્પો ખરીદ્યા હતા.
    trial_period_ending:
      name: ટ્રાયલનો સમયગાળો પૂરો થઈ રહ્યો છે
      description: ગ્રાહક સબ્સ્ક્રિપ્શન કે ટ્રાયલની મુદત પૂરી થાય તે પહેલાં પ્રોડક્ટ
        રિટર્ન કરી રહ્યા છે.
    fitment:
      name: ફિટિંગ
      description: આઇટમ જે ચોક્કસ મૉડલ કે ભાગ પર લગાવવાની છે, તેની સાથે યોગ્ય રીતે
        બંધબેસતી નથી.
    shedding:
      description: વાપરતી વખતે આઇટમમાંથી વધુ પડતા રેસા અથવા કણો ખરે છે.
      name: રેસા ખરે છે
    adjustability:
      description: ગ્રાહકની જરૂરિયાત મુજબ આઇટમમાં કે તેના માપમાં પૂરતો ફેરફાર કરી
        શકાતો નથી.
      name: જરૂર મુજબ ગોઠવવાની ક્ષમતા
    lifting_capacity:
      name: વજન ઊંચકવાની ક્ષમતા
      description: ઉપકરણ જેટલું મહત્તમ વજન ઊંચકી શકે છે તે પૂરતું નથી.
    dye_transferred:
      description: આઇટમનો રંગ ઊતરીને બીજી સપાટીઓ અથવા કપડાં પર લાગ્યો છે.
      name: રંગ બીજી વસ્તુ પર લાગ્યો
    too_loud:
      description: જે વાતાવરણમાં આઇટમ વાપરવાની છે ત્યાં તેનો અવાજ વધુ પડતો છે અથવા
        ખલેલ પહોંચાડે છે.
      name: અવાજ ખૂબ મોટો
    dispenser:
      name: ડિસ્પેન્સર
      description: પ્રોડક્ટ બહાર કાઢવાની વ્યવસ્થા સંતોષકારક નથી.
    sharpness:
      name: ધાર
      description: સાધનની કાપવાની ધાર અથવા અણી જરૂરી પ્રમાણમાં તીક્ષ્ણ નથી.
    power_output:
      description: ઉપકરણમાંથી મળતી ઊર્જા ઇચ્છિત કામ માટે અપૂરતી અથવા વધુ પડતી છે.
      name: શક્તિનું આઉટપુટ
    duplicate_order:
      name: એક જ ઑર્ડર બે વાર થયો
      description: ગ્રાહકે ભૂલથી એક જ આઇટમનો ઘણી વાર ઑર્ડર આપ્યો.
    roast_level:
      name: શેકવાનું પ્રમાણ
      description: કૉફીના દાણા જેટલા શેકેલા છે તે ગ્રાહકની સ્વાદની પસંદ મુજબ નથી.
    too_simple:
      description: આઇટમમાં ગ્રાહકને જોઈતી જટિલતા અથવા સુવિધાઓ નથી.
      name: ખૂબ સરળ
    damaged_packaging:
      description: બહારનું કન્ટેનર નુકસાન પામેલી સ્થિતિમાં મળ્યું છે.
      name: ક્ષતિગ્રસ્ત પૅકેજિંગ
    uncomfortable:
      description: પ્રોડક્ટ વાપરતી વખતે શરીરને અસુવિધા થાય છે.
      name: આરામદાયક નથી
    hard_to_inflate:
      name: હવા ભરવી મુશ્કેલ છે
      description: વાલ્વ કે તેની કાર્યપદ્ધતિને કારણે આઇટમમાં હવા ભરવામાં મુશ્કેલી
        પડે છે.
    padding:
      name: પૅડિંગ
      description: નરમ, રક્ષણાત્મક સામગ્રીનું પ્રમાણ અથવા તેની ગોઠવણી અપેક્ષા મુજબ
        નથી.
    light_temperature:
      name: પ્રકાશનું રંગ તાપમાન
      description: નીકળતા પ્રકાશનું રંગ તાપમાન (ગરમ કે ઠંડો રંગ) ગ્રાહકની પસંદ મુજબ
        નથી.
    temperature_regulation:
      name: તાપમાન નિયંત્રણ
      description: સામગ્રી શરીરની વધુ પડતી ગરમી રોકી રાખે છે, જેથી વપરાશકર્તાને ખૂબ
        ગરમી લાગે છે.
    difficult_to_assemble:
      name: ભાગો જોડવા મુશ્કેલ છે
      description: પ્રોડક્ટના ભાગો જોડવાની પ્રક્રિયા ખૂબ મુશ્કેલ કે જટિલ છે અથવા સૂચનાઓ
        સ્પષ્ટ નથી.
    stained:
      description: આઇટમનો રંગ બદલાયો છે અથવા તેના પર ડાઘ છે, જેનાથી તેનો દેખાવ બગડે
        છે.
      name: ડાઘ પડેલા
    base_curve:
      name: આધારભૂત વક્રતા
      description: લેન્સનો વળાંક ગ્રાહકની આંખના આકાર અથવા પ્રિસ્ક્રિપ્શનની જરૂરિયાતો
        મુજબ નથી.
    service_unavailable:
      name: સેવા ઉપલબ્ધ નથી
      description: ગ્રાહકના વિસ્તારમાં અથવા સંજોગોમાં વિનંતી કરેલી સેવા ઉપલબ્ધ નથી
        અથવા પૂરી પાડી શકાતી નથી.
    frame_color:
      description: ફ્રેમનો રંગ ગ્રાહકની પસંદ મુજબ નથી.
      name: ફ્રેમનો રંગ
    waist_too_big:
      name: કમરનું માપ ખૂબ મોટું છે
      description: કમરનું માપ ગ્રાહકના શરીર માટે જરૂરી માપ કરતાં મોટું છે.
    unstable:
      description: ચલાવતી કે વાપરતી વખતે આઇટમ ખસે છે, વધુ પડતી ધ્રૂજે છે અથવા સંતુલન
        ગુમાવે છે.
      name: અસ્થિર
    cold_duration:
      name: ઠંડક ટકવાનો સમય
      description: આઇટમ ગ્રાહકને જરૂરી હોય તેટલા સમય સુધી ઠંડી રહેતી નથી.
    realism:
      name: વાસ્તવિકતા
      description: દેખાવ અથવા કાર્ય પૂરતા વાસ્તવિક લાગતા નથી.
    too_firm:
      description: આઇટમ અપેક્ષા કરતાં વધુ કઠણ છે અથવા ઓછી દબાય છે.
      name: ખૂબ જ કઠણ છે
    style:
      name: શૈલી
      description: આઇટમની ડિઝાઇન, કટ કે દેખાવ ગ્રાહકની વ્યક્તિગત પસંદને અનુરૂપ નથી.
    applicator:
      name: લગાવવાનું સાધન
      description: સાથે આપેલા સાધનથી પ્રોડક્ટ અસમાન રીતે કે નિયંત્રણ વગર ફેલાય છે.
    volume:
      description: ઉપકરણનો અવાજ પૂરતો ઊંચો નથી અથવા વધુ પડતો ઊંચો છે.
      name: વોલ્યુમ
    presentation:
      description: આઇટમ અથવા તેમાંની વસ્તુઓની ગોઠવણી અને રજૂઆત સંતોષકારક નથી.
      name: રજૂઆત
    wind_resistance:
      description: આઇટમની પવન રોકવાની ક્ષમતા ઇચ્છિત પરિસ્થિતિઓ અથવા પ્રવૃત્તિ માટે
        યોગ્ય નથી.
      name: પવન સામે ટકી રહેવાની ક્ષમતા
    waist_too_high:
      description: કપડાનો કમરનો ભાગ શરીર પર વધુ પડતો ઊંચો બેસે છે.
      name: કમરનો ભાગ ખૂબ ઊંચો
    color:
      description: આઇટમનો રંગ, છટા અથવા દેખાવ ગ્રાહકની પસંદ કે અપેક્ષા મુજબ નથી.
      name: રંગ
    cups_too_thick:
      name: કપ ખૂબ જાડા છે
      description: કપનું પેડિંગ કે મટીરિયલ ખૂબ જાડું છે.
    barrel_size:
      description: કર્લિંગ આયર્ન અથવા સાધનનો વ્યાસ ઇચ્છિત પરિણામ માટે યોગ્ય માપનો
        નથી.
      name: બૅટના બેરલનું માપ
    detail:
      description: આઇટમની ડિઝાઇન અથવા તેનાથી મળતા પરિણામમાં પૂરતી બારીકાઈ કે ચોકસાઈ
        નથી.
      name: વિગત
    fails_to_detect_threats:
      name: જોખમો શોધી શકતું નથી
      description: સુરક્ષા કે સલામતી માટેનું ઉપકરણ અપેક્ષા મુજબ જોખમો ઓળખી શકતું નથી.
    opacity:
      name: અપારદર્શકતા
      description: પારદર્શકતાનું પ્રમાણ અથવા આરપાર દેખાવાની ગુણવત્તા ગ્રાહકની પસંદ
        મુજબ નથી.
    scratched:
      description: આઇટમની સપાટી પર નિશાન અથવા ઘસરકા છે, જેનાથી તેનો દેખાવ બગડે છે.
      name: ઉઝરડા પડેલા છે
    closure:
      name: બંધ કરવાની વ્યવસ્થા
      description: આઇટમ ખોલવા કે બંધ કરવાની વ્યવસ્થા વાપરવી મુશ્કેલ છે અથવા તે મજબૂત
        રીતે બંધ થતી નથી.
    weight_capacity:
      name: વજન સહન કરવાની ક્ષમતા
      description: આઇટમની મહત્તમ વજન સહન કરવાની ક્ષમતા ગ્રાહકના ઇચ્છિત ઉપયોગ માટે
        પૂરતી નથી.
    strength:
      description: આઇટમની રાસાયણિક અસરકારકતા અથવા ભૌતિક તાકાત અપેક્ષા મુજબ નથી.
      name: શક્તિ
    plate_type:
      name: પ્લેટનો પ્રકાર
      description: પ્લેટની સામગ્રી અથવા તેના પરનું આવરણ ગ્રાહકની પસંદ મુજબ નથી.
    drainage:
      name: પાણીનો નિકાલ
      description: આઇટમમાંથી પ્રવાહીનો યોગ્ય રીતે નિકાલ થતો નથી.
    size:
      description: પ્રોડક્ટનું માપ ગ્રાહકની અપેક્ષા મુજબ નહોતું.
      name: માપ
    sole_too_thin:
      description: પગરખાંના તળિયામાં પૂરતી ગાદી અથવા રક્ષણ નથી.
      name: તળિયું ખૂબ પાતળું
    cups_too_tight:
      name: કપ ખૂબ ચુસ્ત છે

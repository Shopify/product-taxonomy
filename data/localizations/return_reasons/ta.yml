        குறைவாகவோ அதிகமாகவோ உள்ளது.
    heel_too_thick:
      description: குதிகால் பகுதியின் அகலம் அல்லது பருமன் அதிகமாக உள்ளது.
      name: ஹீல் மிகவும் தடிமனாக உள்ளது
    too_quiet:
      name: ஒலியளவு மிகக் குறைவு
      description: பயன்படுத்தவுள்ள சூழலில் தெளிவாகக் கேட்கும் அளவுக்கு உருப்படியின்
        ஒலி போதுமானதாக இல்லை.
    rubbing:
      description: தொடர்ந்து அசையும்போது உருப்படி சருமத்தில் உராய்வை அல்லது சிராய்ப்பை
        ஏற்படுத்துகிறது.
      name: உராய்கிறது
    bristles_too_coarse:
      name: தூரிகை முட்கள் மிகவும் கரடுமுரடாக உள்ளன
      description: திட்டமிட்ட பயன்பாட்டிற்கு பிரஷ் மிகவும் கரடுமுரடாக உள்ளது அல்லது
        அதிகமாகக் கீறுகிறது.
    stone_setting:
      description: அலங்காரக் கற்கள் அல்லது ரத்தினங்கள் பதிக்கப்பட்டுள்ள விதம் திருப்திகரமாக
        அல்லது உறுதியாக இல்லை.
      name: கல் பதிப்பு
    loose_seams:
      description: தையல் இணைப்புகள் உறுதியாக இல்லாதது தரமற்ற தயாரிப்பைக் காட்டுகிறது.
      name: தளர்வான தையல்கள்
    ventilation:
      description: உருப்படியில் போதுமான காற்றோட்டம் அல்லது காற்று ஊடுருவும் தன்மை
        இல்லை.
      name: காற்றோட்டம்
    lacks_security_features:
      name: பாதுகாப்பு அம்சங்கள் இல்லை
      description: எதிர்பார்த்த பாதுகாப்பு அல்லது திருட்டுத் தடுப்பு அமைப்புகள் தயாரிப்பில்
        இல்லை.
    text_size:
      description: அச்சிடப்பட்ட அல்லது காட்டப்படும் உரையின் எழுத்துரு அளவு படிப்பதற்குக்
        கடினமாக உள்ளது.
      name: எழுத்து அளவு
    wrong_amount:
      description: கிடைத்த தயாரிப்பின் அளவு ஆர்டர் செய்த அல்லது எதிர்பார்த்த அளவிலிருந்து
        வேறுபடுகிறது.
      name: தவறான அளவு
    too_subtle:
      name: மிகவும் மிதமாக உள்ளது
      description: உருப்படியின் விளைவில் உள்ள தன்மை, நுணுக்கம் அல்லது நுட்பமான வேறுபாடு
        விரும்பிய அளவுக்குத் தாக்கத்தை ஏற்படுத்தவில்லை.
    frequency:
      description: அதிர்வு அல்லது சமிக்ஞை பரிமாற்றத்தின் அதிர்வெண் வாடிக்கையாளரின்
        உபகரணத்துக்கு அல்லது விருப்பத்துக்குப் பொருந்தவில்லை.
      name: அதிர்வெண்
    seams_splitting:
      description: தையல் இணைப்புகள் பிரிகின்றன அல்லது பிரிவதற்கான அறிகுறிகள் தெரிகின்றன.
      name: தையல் இணைப்புகள் பிரிகின்றன
    stability:
      name: நிலைத்தன்மை
      description: வைக்கும்போது அல்லது பயன்படுத்தும்போது உருப்படி தள்ளாடுகிறது அல்லது
        நிலையாக இல்லை.
    carbonation:
      name: கார்பனேற்றம்
      description: பானத்தில் உள்ள நுரை அல்லது குமிழ்களின் அளவு மிக அதிகமாக அல்லது
        குறைவாக உள்ளது.
    reaction:
      description: தயாரிப்பு தோலில் தேவையற்ற எதிர்வினை அல்லது எரிச்சலை ஏற்படுத்தியது.
      name: எதிர்வினை
    too_drying:
      name: அதிகமாக உலரச் செய்கிறது
      description: தயாரிப்பு அதிகப்படியான ஈரப்பதத்தை அகற்றுவதால் தோல் அல்லது முடி
        வறண்டு போகிறது.
    band_too_big:
      description: பட்டையின் சுற்றளவு மிக அதிகமாக இருப்பதால் உடலில் இறுக்கமாகப் பொருந்தவில்லை.
      name: பட்டை மிகவும் பெரிதாக உள்ளது
    doesnt_fit_mattress:
      description: படுக்கை விரிப்புகளின் அளவுகள் மெத்தையின் அளவுக்குப் பொருந்தவில்லை.
      name: மெத்தைக்குப் பொருந்தவில்லை
    seal:
      name: அடைப்பு
      description: உருப்படியின் சீல் தேவையான அளவுக்குக் காற்று அல்லது நீர் புகாதபடி
        இல்லை.
    lock:
      description: உள்ளமைந்த சாவிப் பூட்டு அல்லது எண் பூட்டு பழுதாக உள்ளது அல்லது
        எதிர்பார்த்தபடி செயல்படவில்லை.
      name: பூட்டு
    lubrication:
      name: உயவூட்டல்
      description: சரியாகச் செயல்பட முடியாத அளவுக்குத் தயாரிப்பு மிகவும் உலர்வாக அல்லது
        வழவழப்பாக உள்ளது.
    breaks_easily:
      name: எளிதில் உடைகிறது
      description: உருப்படி எளிதில் உடையும் நிலையில் உள்ளது அல்லது வழக்கமான பயன்பாட்டிலேயே
        நீடித்து உழைப்பதில்லை.
    missing_desired_features:
      description: வாடிக்கையாளர் எதிர்பார்த்த குறிப்பிட்ட செயல்பாடுகள் அல்லது பண்புக்கூறுகள்
        தயாரிப்பில் இல்லை.
      name: விரும்பிய அம்சங்கள் இல்லை
    caused_irritation:
      name: எரிச்சலை ஏற்படுத்தியது
      description: தயாரிப்பு தோலில் அல்லது உடலில் அசௌகரியத்தை ஏற்படுத்தியது.
    field_of_view_too_narrow:
      description: ஒளியியல் கருவி அல்லது முகக்கவசம் வழியாகப் பார்க்கக்கூடிய பகுதி
        மிகவும் குறுகலாக உள்ளது.
      name: பார்வைப் பரப்பு மிகவும் குறுகலாக உள்ளது
    buttons_not_accessible:
      name: பொத்தான்களை அணுக முடியவில்லை
      description: உறை அல்லது மூடி சாதனத்தின் கட்டுப்பாடுகளை மறைப்பதால் அவற்றைப் பயன்படுத்த
        முடியவில்லை.
    rod_power:
      description: தூண்டிலின் எதிர்ப்பு விசை அல்லது தூக்கும் வலிமை, திட்டமிட்ட பயன்பாட்டிற்கு
        மிகக் குறைவாகவோ அதிகமாகவோ உள்ளது.
      name: தூண்டிலின் வலிமை
    bitterness:
      description: சுவை விரும்பத்தகாத அளவுக்குக் கடுமையாகவோ கசப்பாகவோ உள்ளது.
      name: கசப்பு
    test_method:
      description: சோதனைத் தொகுப்பைப் பயன்படுத்துவதற்கான செயல்முறை வாடிக்கையாளரின்
        விருப்பத்திற்குப் பொருந்தவில்லை.
      name: சோதனை முறை
    too_weak:
      name: மிகவும் பலவீனமாக உள்ளது
      description: உருப்படியின் விசை, வெளியீடு அல்லது விளைவு போதுமானதாக இல்லை அல்லது
        உணர முடியாத அளவுக்குக் குறைவாக உள்ளது.
    compartments:
      name: உட்பிரிவுகள்
      description: பொருட்களை வைக்கும் பிரிவுகளின் எண்ணிக்கை அல்லது அமைப்பு, வாடிக்கையாளர்
        பொருட்களை ஒழுங்குபடுத்தும் தேவைகளுக்கு ஏற்றதாக இல்லை.
    closeness:
      description: கருவி விரும்பிய அளவுக்குத் தோலை ஒட்டிச் சவரம் செய்யவோ வெட்டவோ இல்லை.
      name: நெருக்கம்
    drying_speed:
      name: உலரும் வேகம்
      description: தயாரிப்பு உலரவோ கெட்டியாகவோ ஆகும் வேகம் மிகக் குறைவாகவோ அதிகமாகவோ
        உள்ளது.
    lacks_required_certification:
      description: தயாரிப்பிற்குத் தேவையான ஒழுங்குமுறை ஒப்புதல்கள் இல்லை அல்லது அது
        தரநிலைகளுக்கு இணங்கவில்லை.
      name: தேவையான சான்றிதழ் இல்லை
    pilling:
      name: துணியில் நாருருண்டைகள் உருவாகின்றன
      description: பயன்படுத்தும்போதோ துவைக்கும்போதோ துணியில் எதிர்பார்த்ததைவிட விரைவாக
        நாருருண்டைகள் அல்லது பிசிறுகள் உருவாகின்றன.
    shelf_life:
      name: பயன்பாட்டுக் காலம்
      description: தயாரிப்பு பயன்படுத்தக்கூடிய நிலையில் அல்லது புதுமையாக இருக்கும்
        காலம் எதிர்பார்த்ததைவிடக் குறைவாக உள்ளது.
    lock_type:
      description: உருப்படியைப் பூட்டுவதற்கான அமைப்பு, வசதி அல்லது பாதுகாப்பு குறித்த
        வாடிக்கையாளரின் விருப்பத்திற்குப் பொருந்தவில்லை.
      name: பூட்டு வகை
    chest_too_small:
      description: ஆடையின் மார்பளவு வாடிக்கையாளருக்கு மிகவும் சிறியதாக உள்ளது.
      name: மார்புப்பகுதி மிகவும் சிறிதாக உள்ளது
    footbed_too_wide:
      name: பாதம் பதியும் பகுதி மிக அகலம்
      description: பாதம் பதியும் தளத்தின் அகலம் அதிகமாக இருப்பதால் காலில் உறுதியாகப்
        பொருந்தவில்லை.
    age_range:
      description: உருப்படிக்குப் பரிந்துரைக்கப்பட்ட வயதுக் குழு, அதைப் பயன்படுத்தவிருப்பவரின்
        வயதுக்குப் பொருந்தவில்லை.
      name: வயது வரம்பு
    inverter_type:
      description: குறிப்பிட்ட மின்மாற்றுத் தொழில்நுட்பம் வாடிக்கையாளரின் தேவைகளுக்குப்
        பொருந்தவில்லை.
      name: இன்வெர்ட்டர் வகை
    flange_size:
      name: பால் பம்ப் கவசத்தின் அளவு
      description: பால் பம்ப் கவசத்தின் திறப்பு விட்டம் பயனருக்குப் பொருந்தாததால்
        சௌகரியம் அல்லது பால் வெளியேற்றம் பாதிக்கப்படுகிறது.
    other_reason:
      description: ரிட்டர்னுக்கான காரணம் முன்வரையறுக்கப்பட்ட எந்த வகையிலும் பொருந்தவில்லை.
      name: மற்றவை
    effectiveness:
      name: பலனளிக்கும் திறன்
      description: தயாரிப்பு அதன் முதன்மைச் செயல்பாட்டைச் செய்யவோ உறுதியளித்த பலன்களை
        வழங்கவோ எதிர்பார்த்த தரத்தில் இல்லை.
    board_volume:
      name: பலகையின் கனஅளவு
      description: பலகையின் நீர் இடப்பெயர்ச்சிக் கனஅளவு, பயனரின் எடைக்குப் போதுமான
        மிதப்புத்திறனை வழங்கவில்லை அல்லது அளவுக்கு அதிகமான மிதப்புத்திறனை வழங்குகிறது.
    squeaks:
      description: பயன்படுத்தும்போது உருப்படியிலிருந்து தேவையற்ற கீச்சொலிகள் எழுகின்றன.
      name: கீச்சொலி எழுகிறது
    articulation:
      description: உருப்படியின் மூட்டுகள் அசையும் வரம்பு அல்லது தரம் வாடிக்கையாளரின்
        தேவைகளுக்குப் பொருந்தவில்லை.
      name: மூட்டு அசைவு
    doesnt_blend_well:
      description: தயாரிப்பு மற்ற பொருட்களுடன் சீராகக் கலக்கவில்லை அல்லது பரப்புகளில்
        சீராக ஒன்றிணையவில்லை.
      name: நன்றாகக் கலப்பதில்லை
    narration:
      description: ஒலி விவரிப்பின் குரல், தொனி அல்லது பாணி வாடிக்கையாளருக்குப் பிடிக்கவில்லை.
      name: ஒலி விவரிப்பு
    color_too_muted:
      description: வாடிக்கையாளர் விரும்பும் அளவுக்கு நிறம் பளிச்சென்றோ அடர்த்தியாகவோ
        இல்லை.
      name: நிறம் மிகவும் மங்கலாக உள்ளது
    odor:
      name: வாசனை
      description: தயாரிப்பிலிருந்து விரும்பத்தகாத அல்லது எதிர்பாராத வாசனை வருகிறது.
    transparency:
      name: ஒளிபுகும் தன்மை
      description: வாடிக்கையாளரின் விருப்பத்திற்கு ஏற்றதைவிடப் பொருள் அதிகமாக ஊடுருவித்
        தெரிகிறது அல்லது போதுமான தெளிவுடன் இல்லை.
    sound_level:
      description: வெளிவரும் ஒலி, குறிப்பிட்ட டெசிபல் அளவையோ அதன் செயல்பாட்டிற்குத்
        தேவையான செயல்திறன் தரநிலையையோ பூர்த்தி செய்யவில்லை.
      name: ஒலி அளவு
    coverage:
      name: மறைக்கும் திறன்
      description: உருப்படி ஒரு பரப்பை மறைக்கும், பாதுகாக்கும் அல்லது அதன் மீது பரவும்
        அளவு வாடிக்கையாளரின் தேவைகளுக்குப் பொருந்தவில்லை.
    breathability:
      name: காற்றோட்டத் திறன்
      description: துணி ஈரத்தை வெளியேற்றாததால் அதிக வெப்பம் அல்லது ஈரப்பிசுபிசுப்பான
        உணர்வு ஏற்படுகிறது.
    touch_response:
      name: தொடுதலுக்குப் பதிலளிக்கும் திறன்
      description: தொடு இடைமுகத்தின் உணர்திறன் மிக அதிகமாகவோ குறைவாகவோ உள்ளது.
    temperature:
      name: வெப்பநிலை
      description: உருப்படி உருவாக்கும் அல்லது பராமரிக்கும் வெப்பம் அல்லது குளிரின்
        அளவு வாடிக்கையாளரின் விருப்பத்திற்கு ஏற்றதாக இல்லை.
    length:
      name: நீளம்
      description: உருப்படியின் நீளம் வாடிக்கையாளரின் தேவைகளுக்கு மிக அதிகமாக அல்லது
        குறைவாக உள்ளது.
    service_area:
      description: சேவை வழங்கப்படும் பகுதிக்குள் வாடிக்கையாளரின் முகவரி வரவில்லை.
      name: சேவைப் பகுதி
    sole_too_thick:
      description: காலணியின் அடித்தளம் மிக அதிகத் தடிமனாக உள்ளது.
      name: காலணி அடித்தளம் மிகவும் தடிமனாக உள்ளது
    night_vision:
      name: இரவுப் பார்வை
      description: சாதனத்தின் அகச்சிவப்பு அல்லது ஒளியில்லா பயன்முறையில் உருவாகும்
        படம் தெளிவாக இல்லை அல்லது பயனுள்ளதாக இல்லை.
    comfort:
      description: உருப்படியைப் பயன்படுத்தும்போது ஏற்படும் உணர்வோ உடலுக்கேற்ற அதன்
        வடிவமைப்போ எதிர்பார்த்த அளவுக்கு இல்லை.
      name: சௌகரியம்
    gauge:
      description: உருப்படியின் குறிப்பிடப்பட்ட தடிமன் அல்லது விட்டம் திட்டமிட்ட பயன்பாட்டிற்குப்
        பொருந்தவில்லை.
      name: கேஜ் அளவு
    loose_around_ankle:
      description: கணுக்கால் பகுதியில் ஆடை இறுக்கமாகப் பொருந்தவில்லை.
      name: கணுக்காலில் தளர்வாக உள்ளது
    assortment:
      name: வகைகளின் கலவை
      description: பொதியில் உள்ள உருப்படிகளின் வகைகள் வாடிக்கையாளர் விரும்பியபடி இல்லை.
    razor_type:
      name: சவரக் கருவி வகை
      description: குறிப்பிட்ட பிளேடு அமைப்பு அல்லது பாணி வாடிக்கையாளரின் சவர விருப்பத்திற்குப்
        பொருந்தவில்லை.
    tooth_spacing:
      description: சீப்பு அல்லது பிளேடின் பற்களுக்கு இடையிலான இடைவெளி வாடிக்கையாளரின்
        தேவைகளுக்குப் பொருந்தவில்லை.
      name: பற்களுக்கு இடையிலான இடைவெளி
    head_support:
      description: உருப்படி தலை மற்றும் கழுத்தை நிலையாகவோ சரியான நிலையிலோ வைக்க அல்லது
        சௌகரியமாகத் தாங்கப் போதுமானதாக இல்லை.
      name: தலைக்கான ஆதரவு
    too_narrow:
      name: மிகவும் குறுகலாக உள்ளது
      description: தேவையான பொருத்தம், இடம் அல்லது பயன்பாட்டிற்கு உருப்படியின் அகலம்
        போதுமானதாக இல்லை.
    too_wide:
      name: மிகவும் அகலமாக உள்ளது
      description: தேவையான பொருத்தம், இடம் அல்லது பயன்பாட்டிற்கு உருப்படியின் அகலம்
        மிக அதிகமாக உள்ளது.
    capacity:
      name: கொள்ளளவு
      description: உருப்படி கொள்ளக்கூடிய அல்லது செயலாக்கக்கூடிய அளவு வாடிக்கையாளரின்
        தேவைகளுக்குப் போதுமானதாக இல்லை.
    low_light_performance:
      description: மங்கலான வெளிச்சத்தில் சாதனம் எடுக்கும் படங்கள் அல்லது வீடியோக்கள்
        தரம் குறைவாக உள்ளன.
      name: குறைந்த வெளிச்சத்தில் செயல்திறன்
    whitening_results:
      name: வெண்மையாக்கும் பலன்
      description: கிடைத்த நிறமாற்றத்தின் அளவு எதிர்பார்த்ததைவிடக் குறைவாக உள்ளது.
    lens_color:
      name: லென்ஸ் நிறம்
      description: மூக்குக்கண்ணாடி லென்ஸின் நிறச்சாயல், பார்க்கவுள்ள சூழலுக்கோ செயல்பாட்டிற்கோ
        ஏற்றதாக இல்லை.
    grit:
      name: சிராய்ப்புத் துகள் அளவு
      description: சிராய்ப்புப் பரப்பின் கரடுமுரடான தன்மை வாடிக்கையாளரின் தேவைகளுக்குப்
        பொருந்தவில்லை.
    detection_range:
      name: கண்டறியும் வரம்பு
      description: சாதனம் கண்டறியக்கூடிய தொலைவு அல்லது பரப்பளவு, பயன்படுத்தவுள்ள நோக்கத்திற்கு
        ஏற்றதாக இல்லை.
    band_too_small:
      description: பட்டையின் சுற்றளவு போதுமானதாக இல்லாததால் உடலை இறுக்குகிறது.
      name: பட்டை மிகவும் சிறியது
    difficult_to_install:
      name: நிறுவுவது கடினம்
      description: நிறுவும் செயல்முறைக்கு வாடிக்கையாளர் எதிர்பார்த்ததைவிட அதிக முயற்சி
        அல்லது திறன் தேவைப்படுகிறது.
    format:
      description: உருப்படியின் அமைப்பு அல்லது வடிவம் பயனரின் தேவைகளுக்குப் பொருந்தவில்லை.
      name: வடிவம்
    smudges:
      description: தயாரிப்பு மற்ற பரப்புகளில் படிந்து தடயத்தை ஏற்படுத்துகிறது அல்லது
        தொடும்போது அதில் எளிதில் தடயங்கள் பதிகின்றன.
      name: அழுக்குத் தடங்கள்
    wrong_format:
      description: மீடியா வகை அல்லது அதன் வடிவமைப்பு வாடிக்கையாளரின் சாதனம் அல்லது
        விருப்பத்திற்குப் பொருந்தவில்லை.
      name: தவறான வடிவம்
    nicotine_strength:
      description: தயாரிப்பில் உள்ள நிகோடின் செறிவு வாடிக்கையாளருக்கு மிக அதிகமாகவோ
        குறைவாகவோ உள்ளது.
      name: நிகோடின் செறிவு
    timer:
      description: நேரக் கட்டுப்பாட்டுச் செயல்பாடு அல்லது கால அளவு அமைப்பு திருப்திகரமாக
        இல்லை.
      name: டைமர்
    vehicle_fit:
      description: வாடிக்கையாளரின் குறிப்பிட்ட வாகனத்தில் உருப்படியைச் சரியாக இணைக்க
        முடியவில்லை அல்லது வாகனத்தின் உள்ளே அது பொருந்தவில்லை.
      name: வாகனப் பொருத்தம்
    draw_weight:
      description: வில்நாணை இழுக்கத் தேவையான விசை வில்லாளருக்கு மிக அதிகமாகவோ குறைவாகவோ
        உள்ளது.
      name: வில்நாண் இழுக்கும் விசை
    magnification_too_weak:
      name: உருப்பெருக்கம் மிகக் குறைவு
      description: வழங்கப்படும் உருப்பெருக்க அளவு வாடிக்கையாளரின் பார்வைத் தேவைகளுக்குப்
        போதுமானதாக இல்லை.
    band_too_thick:
      description: வாடிக்கையாளர் விரும்புவதைவிடப் பட்டையின் அகலம் மிக அதிகமாக உள்ளது.
      name: பட்டை மிகவும் தடிமனாக உள்ளது
    cups_too_loose:
      name: கப்கள் மிகவும் தளர்வாக உள்ளன
      description: கப் பகுதி உறுதியாகப் பொருந்தவில்லை அல்லது போதுமான தாங்குதலை வழங்கவில்லை.
    compression:
      description: ஆடை கொடுக்கும் அழுத்தம் மிக அதிகமாகவோ குறைவாகவோ உள்ளது.
      name: அழுத்திப் பிடிக்கும் தன்மை
    doesnt_fit_phone:
      description: துணைக்கருவியின் அளவுகள் குறிப்பிட்ட ஃபோன் மாடலுக்குப் பொருந்தவில்லை.
      name: ஃபோனுக்குப் பொருந்தவில்லை
    pressure_rating:
      name: அழுத்த மதிப்பீடு
      description: உருப்படி தாங்கக்கூடிய அல்லது உருவாக்கக்கூடிய அதிகபட்ச அழுத்தம்,
        பயன்படுத்தவுள்ள நோக்கத்திற்கு ஏற்றதாக இல்லை.
    ordered_wrong_item:
      name: தவறான உருப்படி ஆர்டர் செய்யப்பட்டது
      description: வாடிக்கையாளர் தவறுதலாக வேறொரு தயாரிப்பை வாங்கிவிட்டார்.
    material_not_durable:
      description: துணி அல்லது தயாரிப்புப் பொருள் எதிர்பார்த்த அளவுக்கு நீடிக்கவில்லை
        அல்லது தேய்மானத்தைத் தாங்கவில்லை.
      name: பொருள் நீடித்து உழைக்கவில்லை
    bubble_output:
      description: உருவாகும் குமிழ்களின் எண்ணிக்கை அல்லது அளவு எதிர்பார்த்தபடி இல்லை.
      name: குமிழ் வெளியீடு
    underwire:
      name: பிராவின் அடிப்புறக் கம்பி
      description: ஆடையில் உள்ள உலோக அல்லது பிளாஸ்டிக் ஆதரவுக் கம்பி அசௌகரியத்தை ஏற்படுத்துகிறது
        அல்லது உடலின் வடிவத்திற்குப் பொருந்தவில்லை.
    caliber:
      name: தோட்டா அல்லது குழல் விட்டம்
      description: எறிபொருள் அல்லது குழலின் குறிப்பிடப்பட்ட விட்டம் வாடிக்கையாளரின்
        கருவிக்குப் பொருந்தவில்லை.
    band_rolls_down:
      description: ஆடை அணிந்த இடத்தில் நிற்காமல் உடலில் கீழே வழுக்குகிறது.
      name: பட்டை கீழ்நோக்கிச் சுருள்கிறது
    tip_size:
      name: முனையின் அளவு
      description: எழுதும் அல்லது பூசும் முனையின் அளவு விரும்பிய துல்லியத்திற்கு ஏற்றதாக
        இல்லை.
    storage_capacity:
      description: டிஜிட்டல் தரவைச் சேமிப்பதற்கான இடம் போதுமானதாக இல்லை.
      name: சேமிப்புத் திறன்
    frame_needs_adjustments:
      description: உருப்படி சரியாகப் பொருந்துவதற்கு நிபுணரின் உதவியுடன் பொருத்தவோ
        மாற்றியமைக்கவோ வேண்டும்.
      name: சட்டகத்தைச் சரிசெய்ய வேண்டும்
    pressure_points:
      description: உருப்படி உடலின் குறிப்பிட்ட பகுதிகளில் அசௌகரியமான அழுத்தத்தைக்
        குவிக்கிறது.
      name: அழுத்தம் ஏற்படும் இடங்கள்
    too_sweet:
      description: சர்க்கரை அல்லது இனிப்புச் சுவையின் அளவு வாடிக்கையாளர் விரும்புவதைவிட
        அதிகமாக உள்ளது.
      name: இனிப்பு அதிகம்
    cups_too_thin:
      description: கப்களில் போதுமான மெத்தைப்பகுதி இல்லை அல்லது அவை போதுமான அளவு மறைக்கவில்லை.
      name: கப்புகள் மிகவும் மெல்லியதாக உள்ளன
    instrument:
      name: இசைக்கருவி
      description: உருப்படி வடிவமைக்கப்பட்டுள்ள குறிப்பிட்ட இசைக்கருவி, வாடிக்கையாளரின்
        கருவியுடன் பொருந்தவில்லை.
    damaged_or_defective:
      name: சேதமடைந்தது அல்லது பழுதானது
      description: உருப்படி சேதம் அல்லது தயாரிப்புக் குறைபாடுகளுடன் வந்தது அல்லது
        எதிர்பார்த்தபடி செயல்படவில்லை.
    fat_content:
      name: கொழுப்பின் அளவு
      description: உணவுத் தயாரிப்பில் உள்ள கொழுப்பின் சதவீதம் வாடிக்கையாளரின் உணவு
        விருப்பத்திற்கு ஏற்றதாக இல்லை.
    material_too_stretchy:
      name: துணி அதிகமாக நீள்கிறது
      description: துணி அளவுக்கு அதிகமாக நீள்வதால் விரும்பிய வடிவத்தை இழக்கிறது.
    horsepower:
      description: மோட்டார் அல்லது இயந்திரம் உருவாக்கும் சக்தி அதன் மதிப்பீட்டிற்கு
        ஏற்ப எதிர்பார்க்கப்படும் செயல்திறனை அளிக்கவில்லை.
      name: குதிரைத்திறன்
    flight_distance:
      name: பறக்கும் தூரம்
      description: உருப்படி காற்றில் பயணிக்கும் தூரம் திட்டமிட்ட செயல்பாடு அல்லது
        சூழலுக்குப் பொருந்தவில்லை.
    spray_pattern:
      description: தெளிப்பு பரவும் விதம் அல்லது வடிவம் வாடிக்கையாளரின் தேவைகளுக்குப்
        பொருந்தவில்லை.
      name: தெளிக்கும் வடிவம்
    region:
      name: பிராந்தியம்
      description: வாடிக்கையாளர் இருக்கும் பகுதியல்லாத வேறொரு புவியியல் பகுதியில்
        மட்டுமே சேவை அல்லது தயாரிப்பைப் பயன்படுத்த முடியும்.
    pulls_in_fabric:
      name: துணியில் நூல்கள் இழுபட்டுள்ளன
      description: பயன்படுத்தும்போது துணி எதிலாவது சிக்கிக்கொள்கிறது அல்லது அதன் நூல்கள்
        இழுபட்டு வெளியே வருகின்றன.
    angle:
      name: கோணம்
      description: சாய்வு அல்லது வளைவின் அளவு வாடிக்கையாளரின் தேவைகளுக்குப் பொருந்தவில்லை.
    pet_didnt_like:
      description: விலங்கிற்குத் தயாரிப்பு பிடிக்கவில்லை என்பது தெளிவாகத் தெரிகிறது
        அல்லது அதைத் தயக்கத்துடன் பயன்படுத்துகிறது.
      name: செல்லப்பிராணிக்குப் பிடிக்கவில்லை
    pitch:
      name: சுருதி
      description: வெளிப்படும் ஒலியின் சுருதி அல்லது அதிர்வெண் பொருத்தமாக இல்லை.
    lather:
      description: தயாரிப்பு உருவாக்கும் நுரையின் அளவு வாடிக்கையாளர் விரும்பும் அளவுக்குப்
        போதுமானதாக இல்லை.
      name: நுரை
    painful:
      description: தயாரிப்பைப் பயன்படுத்தும்போது உடலில் பொதுவான அல்லது கூர்மையான வலி
        ஏற்படுகிறது.
      name: வலியை ஏற்படுத்துகிறது
    too_long:
      description: தேவையான பொருத்தம், இடம் அல்லது பயன்பாட்டிற்கு ஏற்ற அளவைவிட உருப்படியின்
        நீளம் அதிகமாக உள்ளது.
      name: மிகவும் நீளமாக உள்ளது
    absorption:
      description: தயாரிப்பு எதிர்பார்த்தபடி ஒரு பரப்பிலோ உடலிலோ உறிஞ்சப்படவில்லை.
      name: உறிஞ்சும் தன்மை
    piece_count:
      name: துண்டுகளின் எண்ணிக்கை
      description: தொகுப்பில் உள்ள உருப்படிகளின் எண்ணிக்கை வாடிக்கையாளர் எதிர்பார்த்ததைவிட
        வேறுபடுகிறது.
    age_restriction:
      name: வயதுக் கட்டுப்பாடு
      description: குறைந்தபட்ச அல்லது அதிகபட்ச வயது வரம்புகளின் அடிப்படையில் தயாரிப்பைப்
        பயன்படுத்துவதில் கட்டுப்பாடுகள் உள்ளன.
    cups_too_small:
      name: கப்கள் மிகவும் சிறியவை
      description: ஆடையின் கப் கொள்ளளவு வாடிக்கையாளரின் மார்பளவுக்கு மிகவும் குறைவாக
        உள்ளது.
    condition:
      description: சிறிய தேய்மானங்கள் அல்லது குறைபாடுகள் உட்பட உருப்படியின் பராமரிப்பு
        நிலை, விளம்பரத்தில் கூறப்பட்ட தரம் அல்லது விளக்கத்திற்குப் பொருந்தவில்லை.
      name: நிலை
    doesnt_fit_tv:
      description: உருப்படியின் அளவுகள் அல்லது பொருத்தும் அமைப்பு வாடிக்கையாளரின்
        தொலைக்காட்சிக்குப் பொருந்தவில்லை.
      name: டிவிக்குப் பொருந்தவில்லை
    rod_action:
      name: தூண்டில் வளையும் விதம்
      description: அழுத்தம் கொடுக்கும்போது தூண்டில் வளையும் இடம் வாடிக்கையாளரின் விருப்பத்திற்குப்
        பொருந்தவில்லை.
    bust_too_big:
      name: மார்புப் பகுதி மிகவும் பெரியது
      description: ஆடையின் மார்புப் பகுதி வாடிக்கையாளரின் உடலளவுக்கு மிகவும் பெரிதாக
        உள்ளது.
    sleeves_too_tight:
      name: சட்டைக் கைகள் மிகவும் இறுக்கமாக உள்ளன
      description: ஆடையின் கைப்பகுதிகள் இறுக்கமாக இருப்பதால் கைகளை அசைக்கச் சிரமமாக
        அல்லது அசௌகரியமாக உள்ளது.
    grind_size:
      description: அரைக்கப்பட்ட தயாரிப்பின் துகள் அளவு திட்டமிட்ட தயாரிப்பு முறைக்குப்
        பொருந்தவில்லை.
      name: அரைத்த துகள்களின் அளவு
    sleeves_too_loose:
      name: சட்டைக் கைகள் மிகவும் தளர்வாக உள்ளன
      description: ஆடையின் கைப்பகுதிகள் கைகளைச் சுற்றிக் கச்சிதமாகப் பொருந்தவில்லை.
    footbed_too_narrow:
      name: பாதம் பதியும் பகுதி மிகக் குறுகல்
      description: பாதம் பதியும் பகுதியின் அகலம் வாடிக்கையாளரின் பாதத்திற்குப் போதுமானதாக
        இல்லை.
    tarnished:
      description: உலோகப் பரப்பு பளபளப்பை இழந்துள்ளது அல்லது நிறம் மாறியுள்ளது.
      name: பொலிவு மங்கியுள்ளது
    scale:
      name: அளவு விகிதம்
      description: உருப்படியின் அளவு விகிதங்கள் அல்லது அதன் பகுதிகளுக்கிடையிலான அளவுத்
        தொடர்புகள் எதிர்பார்த்தபடி இல்லை.
    material_too_stiff:
      description: துணியில் விரும்பிய நெகிழ்வுத்தன்மை அல்லது மென்மை இல்லை.
      name: பொருள் மிகவும் விறைப்பாக உள்ளது
    low_resolution:
      description: காட்சி வெளியீட்டில் போதுமான நுணுக்கம் அல்லது தெளிவு இல்லை.
      name: குறைந்த தெளிவுத்திறன்
    wrong_dosage:
      name: தவறான மருந்தளவு
      description: செயல்படும் மூலப்பொருளின் வீரியம் அல்லது செறிவு தேவைக்குப் பொருந்தவில்லை.
    chest_too_big:
      name: மார்பளவு மிகவும் பெரியது
      description: ஆடையின் மார்பு அளவு வாடிக்கையாளருக்கு மிகவும் பெரிதாக உள்ளது.
    too_complex:
      description: உருப்படியைப் பயன்படுத்துவதற்கான அம்சங்கள், அமைப்புகள் அல்லது படிகளின்
        எண்ணிக்கை சமாளிக்க முடியாத அளவுக்கு அதிகமாக உள்ளது.
      name: மிகவும் சிக்கலானது
    head_size:
      name: தலையின் அளவு
      description: உருப்படியின் தலைப்பகுதி அளவு, பொருத்தவுள்ள பகுதிக்கோ இடத்திற்கோ
        ஏற்றதாக இல்லை.
    test_format:
      description: சோதனை அல்லது அதன் முடிவுகளின் வடிவம் வாடிக்கையாளர் விரும்பியபடி
        இல்லை.
      name: சோதனை வடிவம்
    metrics_supported:
      name: ஆதரிக்கப்படும் அளவீடுகள்
      description: வாடிக்கையாளருக்குத் தேவையான குறிப்பிட்ட தரவுப் புள்ளிகளைச் சாதனம்
        தடமறிவதில்லை அல்லது காட்டுவதில்லை.
    tangles_easily:
      description: பயன்படுத்தும்போது உருப்படியில் எதிர்பார்த்ததைவிட அதிகமாக முடிச்சுகள்
        அல்லது சிக்கல்கள் ஏற்படுகின்றன.
      name: எளிதில் சிக்கிக்கொள்கிறது
    accuracy:
      description: சாதனம் வழங்கும் அளவீடுகள் அல்லது தரவு போதுமான அளவு துல்லியமாக இல்லை.
      name: துல்லியம்
    loose_threads:
      name: பிரிந்த நூல்கள்
      description: உருப்படியில் தென்படும் பிரிந்த நார்கள் அல்லது நூல் முனைகள், அதன்
        தயாரிப்புத் தரம் மோசமாக இருப்பதைக் காட்டுகின்றன.
    cooling:
      description: சாதனத்தின் வெப்பநிலையைக் குறைக்கும் திறன் போதுமானதாக இல்லை.
      name: குளிரூட்டல்
    frame_crooked:
      name: கண்ணாடிச் சட்டம் கோணலாக உள்ளது
      description: உருப்படியின் கட்டமைப்பு வளைந்துள்ளது அல்லது சீராக இல்லை.
    academic_level:
      name: கல்வி நிலை

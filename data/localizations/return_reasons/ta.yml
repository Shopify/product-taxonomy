    optic_didnt_fit:
      name: ஒளியியல் துணைப்பாகம் பொருந்தவில்லை
      description: ஒளியியல் துணைப்பாகம் சாதனத்தில் சரியாகப் பொருந்தவில்லை.
    pet_refused:
      description: செல்லப்பிராணி தயாரிப்பை உட்கொள்ளவோ பயன்படுத்தவோ அதனுடன் ஈடுபடவோ
        மறுக்கிறது.
      name: செல்லப்பிராணி ஏற்கவில்லை
    ordered_wrong_format:
      name: தவறான வடிவத்தை ஆர்டர் செய்தது
      description: வாடிக்கையாளர் தவறான தயாரிப்பு மாறுபாடு அல்லது உள்ளமைவைத் தேர்ந்தெடுத்துள்ளார்.
    too_rich:
      name: மிகவும் செறிவாக உள்ளது
      description: சுவை அல்லது பதம் வாடிக்கையாளருக்குத் திகட்டுவதாகவோ மிகவும் கனமாகவோ
        உள்ளது.
    doesnt_apply_evenly:
      name: சீராகப் பூச முடிவதில்லை
      description: தயாரிப்பைப் பூசும்போது சீராகப் படியாமல் திட்டுத்திட்டாக அல்லது
        கோடுகளாகப் படிகிறது.
    heel_too_low:
      description: ஹீலின் உயரம் வாடிக்கையாளர் விரும்பியதைவிட மிகவும் குறைவாக உள்ளது.
      name: குதிகால் உயரம் மிகவும் குறைவு
    quality:
      name: தரம்
      description: உருப்படியின் ஒட்டுமொத்தத் தரம் அல்லது வேலைப்பாடு எதிர்பார்ப்புகளைப்
        பூர்த்தி செய்யவில்லை.
    waist_too_small:
      name: இடுப்பு அளவு மிகவும் சிறிதாக உள்ளது
      description: இடுப்பு அளவு வாடிக்கையாளரின் உடலுக்குத் தேவையானதைவிடச் சிறிதாக
        உள்ளது.
    footbed_too_deep:
      description: பாதம் அமரும் பள்ளமான பகுதி அளவுக்கு அதிகமாக ஆழ்ந்துள்ளது.
      name: பாதம் பதியும் தளம் மிகவும் ஆழமாக உள்ளது
    damaged_after_washing:
      description: சுத்தம் செய்யும்போது உருப்படி சேதமடைந்தது.
      name: கழுவிய பிறகு சேதமடைந்தது
    dried_out:
      description: தயாரிப்பு எதிர்பார்த்ததைவிட விரைவாக ஈரப்பதத்தை இழந்ததால் பயன்படுத்துவதில்
        பாதிப்பு ஏற்பட்டுள்ளது.
      name: உலர்ந்துவிட்டது
    straps_too_thin:
      description: பட்டைகளின் அகலம் சௌகரியத்தையோ தாங்குதலையோ வழங்கப் போதுமானதாக இல்லை.
      name: பட்டைகள் மிகவும் மெல்லியதாக உள்ளன
    messy:
      description: தயாரிப்பைப் பயன்படுத்தும்போது எதிர்பாராத விதமாக அசுத்தம் ஏற்படுகிறது
        அல்லது தேவையற்ற எச்சம் தங்குகிறது.
      name: அசுத்தத்தை ஏற்படுத்துகிறது
    hardness:
      name: கடினத்தன்மை
      description: பொருள் அமுக்கத்தையோ மேற்பரப்பு அழுத்தத்தையோ தாங்கும் தன்மை எதிர்பார்த்தபடி
        இல்லை.
    sturdiness:
      description: உருப்படியில் எதிர்பார்த்த கட்டமைப்பு உறுதி இல்லை. வழக்கமான பயன்பாட்டிலேயே
        அது வலுவற்றதாகவோ பலவீனமாகவோ எளிதில் வளையக்கூடியதாகவோ உள்ளது.
      name: உறுதித்தன்மை
    fastening:
      description: உருப்படியை இறுக்கிப் பொருத்துவது அல்லது மூடுவது சிரமமாக உள்ளது
        அல்லது உறுதியாக இல்லை.
      name: பிணைப்பு
    burn_time:
      name: எரியும் நேரம்
      description: உருப்படி எதிர்பார்த்ததைவிடக் குறைந்த அல்லது அதிக நேரம் எரிகிறது.
    support:
      description: உருப்படி உடலுக்குப் போதுமான தாங்குதலையோ வலுவூட்டலையோ வழங்கவில்லை.
      name: தாங்குதல்
    filtration_class:
      description: துகள்களைத் தடுக்கும் வடிகட்டியின் மதிப்பீடு அல்லது தரநிலை தேவைகளைப்
        பூர்த்தி செய்யவில்லை.
      name: வடிகட்டல் தரவகை
    bust_too_small:
      description: ஆடையின் மார்புப்பகுதி வாடிக்கையாளரின் உடலுக்கு மிகவும் சிறிதாக
        உள்ளது.
      name: மார்புப் பகுதி மிகவும் சிறியது
    cuff_too_small:
      description: மணிக்கட்டு அல்லது கையை நுழைக்கும் திறப்பு மிகவும் இறுக்கமாக உள்ளது.
      name: கைப்பட்டை மிகவும் சிறிதாக உள்ளது
    sweetness:
      description: தயாரிப்பில் உள்ள சர்க்கரை அல்லது இனிப்புச் சுவையின் அளவு வாடிக்கையாளரின்
        சுவை விருப்பத்திற்குப் பொருந்தவில்லை.
      name: இனிப்பு
    portion_size:
      description: ஒரு பரிமாறலில் வழங்கப்படும் உணவின் அளவு மிகக் குறைவாக அல்லது அதிகமாக
        உள்ளது.
      name: பரிமாறல் அளவு
    mesh_size:
      name: வலைத் துளைகளின் அளவு
      description: வலை அல்லது திரையின் துளைகளுக்கு இடையிலான இடைவெளி மிக அதிகமாகவோ
        மிகக் குறைவாகவோ உள்ளது.
    brightness:
      name: ஒளிர்வு
      description: உருப்படி வெளியிடும் அல்லது பிரதிபலிக்கும் ஒளியின் அளவு வாடிக்கையாளரின்
        விருப்பத்துக்கு ஏற்ப இல்லை.
    poor_stitching:
      name: தரமற்ற தையல்
      description: தையல் தரமற்றதாகவோ சீரற்றதாகவோ கோணலாகவோ தெரிகிறது. இது உற்பத்திக்
        குறைபாட்டைக் காட்டுகிறது.
    smears:
      name: பரவி ஒட்டுகிறது
      description: அணியும்போது அல்லது பயன்படுத்தும்போது தயாரிப்பு பூசப்பட்ட இடத்திலிருந்து
        பரவுகிறது, மங்குகிறது அல்லது இடம் மாறுகிறது.
    magnification:
      name: உருப்பெருக்கம்
      description: உருப்படி வழங்கும் உருப்பெருக்க அளவு வாடிக்கையாளரின் தேவைகளுக்குப்
        பொருந்தவில்லை.
    too_fine:
      description: தேய்க்கும் மேற்பரப்பு தேவையானதைவிட மென்மையாக உள்ளது அல்லது போதுமான
        அளவு தேய்த்து அகற்றுவதில்லை.
      name: மிகவும் நுண்ணியதாக உள்ளது
    calibration:
      name: அளவுத்திருத்தம்
      description: சாதனத்தை நிர்ணயிக்கப்பட்ட தரநிலைக்கு ஏற்ப அமைப்பதோ சரிசெய்வதோ சிரமமாக
        உள்ளது அல்லது எதிர்பார்த்த பலனைத் தரவில்லை.

    too_tight:
      description: உருப்படி வாடிக்கையாளருக்கு அசௌகரியம் ஏற்படும் அளவுக்கு இறுக்கமாக
        உள்ளது.
      name: மிகவும் இறுக்கமாக உள்ளது
    footbed_too_shallow:
      name: பாதம் அமரும் பகுதியின் ஆழம் மிகக் குறைவு
      description: பாதம் அமரும் பள்ளமான பகுதியில் போதுமான ஆழம் இல்லை.
    difficult_to_fold:
      description: உருப்படியைச் சுருக்குவது அல்லது மடிப்பது எதிர்பார்த்ததைவிடக் கடினமாக
        அல்லது சிரமமாக உள்ளது.
      name: மடிப்பது கடினம்
    incompatible:
      description: வாடிக்கையாளரிடம் ஏற்கெனவே உள்ள உபகரணங்கள், சாதனங்கள் அல்லது அமைப்புடன்
        உருப்படி வேலை செய்யவில்லை அல்லது இணைக்க முடியவில்லை.
      name: இணக்கமாக இல்லை
    responsiveness:
      name: பதிலளிக்கும் திறன்
      description: பயனரின் நேரடி உள்ளீட்டிற்குப் பதிலளிப்பதில் குறிப்பிடத்தக்க தாமதம்
        உள்ளது அல்லது பதிலளிக்கவில்லை.
    compliance:
      description: வாடிக்கையாளருக்குத் தேவையான குறிப்பிட்ட ஒழுங்குமுறை அல்லது நிறுவனத்
        தரநிலைகளைத் தயாரிப்பு பூர்த்தி செய்யவில்லை.
      name: விதிமுறைகளுக்கு இணங்குதல்
    prescription:
      name: மருத்துவப் பரிந்துரை
      description: லென்ஸ் அல்லது உருப்படியின் பார்வைத் திருத்த அளவு வாடிக்கையாளரின்
        பார்வைத் தேவைகளுக்குப் பொருந்தவில்லை.
    drying:
      name: வறட்சி ஏற்படுத்துதல்
      description: தயாரிப்பு சருமம், முடி அல்லது பிற மேற்பரப்புகளில் தேவையற்ற வறட்சியை
        ஏற்படுத்துகிறது.
    too_loose:
      name: மிகவும் தளர்வாக உள்ளது
      description: உருப்படி உறுதியாகப் பொருந்தவில்லை அல்லது போதுமான இறுக்கம் இல்லை.
    refraction:
      name: ஒளிவிலகல்
      description: ஒளியியல் கருவியால் ஏற்படும் ஒளிவிலகல் விரும்பிய காட்சி விளைவை அளிக்கவில்லை.
    weight:
      description: உருப்படியின் எடை அதிகமாக அல்லது குறைவாக இருப்பதால் வாடிக்கையாளர்
        பயன்படுத்த நினைத்த நோக்கத்துக்கு ஏற்றதாக இல்லை.
      name: எடை
    diameter:
      name: விட்டம்
      description: வட்டக் குறுக்குவெட்டின் விட்டம், பயன்படுத்தவுள்ள நோக்கத்திற்கோ
        பொருத்தத் தேவைகளுக்கோ ஏற்றதாக இல்லை.
    too_coarse:
      description: தேய்க்கும் மேற்பரப்பு தேவையைவிடக் கரடுமுரடாக அல்லது அதிகமாக உராய்வதாக
        உள்ளது.
      name: மிகவும் கரடுமுரடாக உள்ளது
    odor_control:
      name: துர்நாற்றக் கட்டுப்பாடு
      description: நாற்றத்தைக் கட்டுப்படுத்தும் அல்லது நீக்கும் உருப்படியின் திறன்
        வாடிக்கையாளரின் தேவைகளுக்குப் போதுமானதாக இல்லை.
    protection:
      description: மோதல்கள் அல்லது வானிலைத் தாக்கங்களிலிருந்து உருப்படி போதுமான பாதுகாப்பை
        வழங்கவில்லை.
      name: பாதுகாப்பு
    movement:
      name: இயக்கம்
      description: உருப்படியின் தானியங்கி அல்லது வெளிவிசையால் ஏற்படும் அசைவு மிக வேகமாகவோ
        மிக மெதுவாகவோ உள்ளது அல்லது வேறு விதத்தில் திருப்திகரமாக இல்லை.
    ordered_multiple:
      name: பலவற்றை ஆர்டர் செய்தது
      description: ஒன்றை மட்டும் வைத்துக்கொள்ளும் நோக்கத்துடன் வாடிக்கையாளர் பல வகைகளை
        வாங்கியுள்ளார்.
    trial_period_ending:
      name: சோதனைக் காலம் முடிவடைகிறது
      description: சந்தா அல்லது சோதனைக் காலம் முடிவதற்குமுன் வாடிக்கையாளர் தயாரிப்பைத்
        திருப்பியளிக்கிறார்.
    fitment:
      name: பொருத்தம்
      description: உருப்படி இணைக்கப்பட வேண்டிய குறிப்பிட்ட மாடல் அல்லது பாகத்துடன்
        சரியாகப் பொருந்தவில்லை.
    shedding:
      description: பயன்படுத்தும்போது உருப்படியிலிருந்து நார்கள் அல்லது துகள்கள் அதிகமாக
        உதிர்கின்றன.
      name: உதிர்தல்
    adjustability:
      description: வாடிக்கையாளரின் தேவைக்கு ஏற்றபடி உருப்படியையோ அதன் அளவையோ போதுமான
        அளவு மாற்ற முடியவில்லை.
      name: சரிசெய்யும் வசதி
    lifting_capacity:
      name: தூக்கும் திறன்
      description: உபகரணம் தூக்கக்கூடிய அதிகபட்ச எடை போதுமானதாக இல்லை.
    dye_transferred:
      description: உருப்படியிலிருந்து சாயம் வெளியேறி மற்ற மேற்பரப்புகள் அல்லது ஆடைகளில்
        படிந்துள்ளது.
      name: சாயம் மற்றவற்றில் படிந்தது
    too_loud:
      description: பயன்படுத்த நினைத்த சூழலுக்கு உருப்படி எழுப்பும் ஒலி அதிகமாக அல்லது
        இடையூறாக உள்ளது.
      name: சத்தம் அதிகம்
    dispenser:
      name: விநியோகிப்பான்
      description: தயாரிப்பை வெளியேற்றும் அமைப்பு திருப்திகரமாக இல்லை.
    sharpness:
      name: கூர்மை
      description: கருவியின் வெட்டும் விளிம்பு அல்லது முனை தேவையான அளவுக்குக் கூர்மையாக
        இல்லை.
    power_output:
      description: செய்ய நினைத்த பணிக்குச் சாதனம் வழங்கும் ஆற்றல் போதுமானதாக இல்லை
        அல்லது அதிகமாக உள்ளது.
      name: சக்தி வெளியீடு
    duplicate_order:
      name: இருமுறை செய்யப்பட்ட ஆர்டர்
      description: வாடிக்கையாளர் தவறுதலாக உருப்படியைப் பலமுறை ஆர்டர் செய்துவிட்டார்.
    roast_level:
      name: வறுத்த அளவு
      description: காபிக் கொட்டைகள் வறுக்கப்பட்ட அளவு வாடிக்கையாளரின் சுவை விருப்பத்திற்குப்
        பொருந்தவில்லை.
    too_simple:
      description: வாடிக்கையாளர் விரும்பிய நுணுக்கம் அல்லது அம்சங்கள் உருப்படியில்
        இல்லை.
      name: மிகவும் எளிமையாக உள்ளது
    damaged_packaging:
      description: வெளிப்புறக் கொள்கலன் சேதமடைந்த நிலையில் வந்துள்ளது.
      name: சேதமடைந்த பொதியாக்கம்
    uncomfortable:
      description: தயாரிப்பைப் பயன்படுத்தும்போது உடலில் அசௌகரியம் ஏற்படுகிறது.
      name: சௌகரியமாக இல்லை
    hard_to_inflate:
      name: காற்று நிரப்புவது கடினம்
      description: வால்வு அல்லது அதன் அமைப்பால் உருப்படியில் காற்று நிரப்புவது கடினமாக
        உள்ளது.
    padding:
      name: மென்மையான திணிப்பு
      description: மென்மையான பாதுகாப்புத் திணிப்பின் அளவு அல்லது அது வைக்கப்பட்டுள்ள
        இடம் எதிர்பார்த்தபடி இல்லை.
    light_temperature:
      name: ஒளியின் நிற வெப்பநிலை
      description: வெளிவரும் ஒளியின் நிற வெப்பநிலை (வெம்மையான அல்லது குளிர்ச்சியான
        நிறச்சாயல்) வாடிக்கையாளரின் விருப்பத்துக்கு ஏற்றதாக இல்லை.
    temperature_regulation:
      name: வெப்பநிலைக் கட்டுப்பாடு
      description: பொருள் உடல் வெப்பத்தை அளவுக்கு அதிகமாகத் தக்கவைப்பதால் பயனரின்
        உடல் அதிகமாகச் சூடாகிறது.
    difficult_to_assemble:
      name: பாகங்களை ஒன்றுசேர்ப்பது கடினம்
      description: தயாரிப்பின் பாகங்களை ஒன்றிணைப்பது மிகவும் கடினமாகவோ சிக்கலாகவோ
        உள்ளது அல்லது வழிமுறைகள் தெளிவாக இல்லை.
    stained:
      description: உருப்படியில் அதன் தோற்றத்தைப் பாதிக்கும் நிறமாற்றம் அல்லது கறைகள்
        உள்ளன.
      name: கறை படிந்துள்ளது
    base_curve:
      name: அடிப்படை வளைவு
      description: லென்ஸின் வளைவு வாடிக்கையாளரின் கண் வடிவத்திற்கோ மருத்துவர் பரிந்துரைத்த
        அளவுகளுக்கோ பொருந்தவில்லை.
    service_unavailable:
      name: சேவை கிடைக்கவில்லை
      description: கோரப்பட்ட சேவை வாடிக்கையாளரின் பகுதி அல்லது சூழலில் வழங்கப்படுவதில்லை
        அல்லது அதைச் செய்ய முடியாது.
    frame_color:
      description: சட்டத்தின் நிறம் வாடிக்கையாளரின் அழகியல் விருப்பத்துக்குப் பொருந்தவில்லை.
      name: சட்டகத்தின் நிறம்
    waist_too_big:
      name: இடுப்பளவு மிகவும் பெரிதாக உள்ளது
      description: இடுப்பளவு வாடிக்கையாளரின் உடலுக்குத் தேவையானதைவிடப் பெரியதாக உள்ளது.
    unstable:
      description: இயக்கும்போது அல்லது பயன்படுத்தும்போது உருப்படி இடம்பெயர்கிறது,
        அதிகமாக அதிர்கிறது அல்லது சமநிலையை இழக்கிறது.
      name: நிலையாக இல்லை
    cold_duration:
      name: குளிர்ச்சி நீடிக்கும் நேரம்
      description: வாடிக்கையாளருக்குத் தேவையான நேரம் வரை உருப்படி குளிர்ச்சியாக இருப்பதில்லை.
    realism:
      name: தத்ரூபம்
      description: தோற்றம் அல்லது செயல்பாடு உண்மையானதைப் போல நம்பும்படி இல்லை.
    too_firm:
      description: உருப்படி எதிர்பார்த்ததைவிடக் கடினமாக அல்லது அழுத்தினாலும் அமுங்காததாக
        உள்ளது.
      name: மிகவும் கெட்டியாக உள்ளது
    style:
      name: பாணி
      description: உருப்படியின் வடிவமைப்பு, வெட்டு அல்லது தோற்றம் வாடிக்கையாளரின்
        தனிப்பட்ட ரசனைக்குப் பொருந்தவில்லை.
    applicator:
      name: பூசும் கருவி
      description: வழங்கப்பட்ட கருவி தயாரிப்பைச் சீரற்ற அல்லது கட்டுப்பாடற்ற முறையில்
        பரப்புகிறது.
    volume:
      description: சாதனம் எழுப்பும் ஒலியின் அளவு போதுமானதாக இல்லை அல்லது மிகவும் அதிகமாக
        உள்ளது.
      name: ஒலியளவு
    presentation:
      description: உருப்படி அல்லது அதில் உள்ளவை அடுக்கப்பட்டு காட்சிப்படுத்தப்பட்டுள்ள
        விதம் திருப்திகரமாக இல்லை.
      name: காட்சிப்படுத்தல்
    wind_resistance:
      description: உருப்படியின் காற்றைத் தடுக்கும் திறன் பயன்படுத்த நினைத்த சூழலுக்கு
        அல்லது செயல்பாட்டுக்கு ஏற்றதாக இல்லை.
      name: காற்றைத் தாங்கும் திறன்
    waist_too_high:
      description: ஆடையின் இடுப்புப் பகுதி உடலில் மிகவும் உயரமாக அமைகிறது.
      name: இடுப்புப் பகுதி மிக உயரமாக உள்ளது
    color:
      description: உருப்படியின் நிறம், நிறச்சாயல் அல்லது தோற்றம் வாடிக்கையாளரின் விருப்பத்துக்கு
        அல்லது எதிர்பார்ப்புக்குப் பொருந்தவில்லை.
      name: நிறம்
    cups_too_thick:
      name: கப்புகள் மிகவும் தடிமனாக உள்ளன
      description: கப்களில் உள்ள மெத்தைப்பகுதி அல்லது துணி மிக அதிகத் தடிமனாக உள்ளது.
    barrel_size:
      description: முடி சுருட்டும் கருவி அல்லது பிற கருவியின் விட்டம் விரும்பிய விளைவைப்
        பெறுவதற்கு ஏற்ற அளவில் இல்லை.
      name: மட்டையின் தடித்த பகுதி அளவு
    detail:
      description: உருப்படியின் வடிவமைப்பு அல்லது வெளியீட்டில் நுணுக்கம் அல்லது துல்லியம்
        போதுமானதாக இல்லை.
      name: நுணுக்கம்
    fails_to_detect_threats:
      name: அச்சுறுத்தல்களைக் கண்டறிவதில்லை
      description: பாதுகாப்புச் சாதனம் எதிர்பார்த்தபடி அபாயங்களைக் கண்டறியவில்லை.
    opacity:
      name: ஒளிபுகாத் தன்மை
      description: ஒளி ஊடுருவும் அல்லது உள்ளிருப்பதை வெளிக்காட்டும் தன்மை வாடிக்கையாளரின்
        விருப்பத்துக்கு ஏற்ற அளவில் இல்லை.
    scratched:
      description: உருப்படியின் மேற்பரப்பில் அதன் தோற்றத்தைப் பாதிக்கும் கீறல்கள்
        அல்லது சிராய்ப்புகள் உள்ளன.
      name: கீறல்கள் உள்ளன
    closure:
      name: மூடும் அமைப்பு
      description: உருப்படியைத் திறக்க அல்லது மூட உதவும் அமைப்பைப் பயன்படுத்துவது
        சிரமமாக உள்ளது அல்லது அது உறுதியாக இல்லை.
    weight_capacity:
      name: எடை தாங்கும் திறன்
      description: உருப்படி தாங்கக்கூடிய அதிகபட்ச எடை வாடிக்கையாளர் பயன்படுத்த நினைத்த
        நோக்கத்துக்குப் போதுமானதாக இல்லை.
    strength:
      description: உருப்படியின் வேதியியல் வீரியம் அல்லது உடல் சார்ந்த விசை எதிர்பார்த்தபடி
        இல்லை.
      name: வலிமை
    plate_type:
      name: தகடு வகை
      description: தகட்டின் பொருள் அல்லது பூச்சு வாடிக்கையாளர் விரும்பியபடி இல்லை.
    drainage:
      name: நீர் வடிதல்
      description: உருப்படியிலிருந்து திரவம் சரியாக வடிவதில்லை.
    size:
      description: தயாரிப்பின் அளவுகள் வாடிக்கையாளர் எதிர்பார்த்தபடி இல்லை.
      name: அளவு
    sole_too_thin:
      description: காலணியின் அடிப்பாகத்தில் போதுமான மென்மையான திணிப்பு அல்லது பாதுகாப்பு
        இல்லை.
      name: காலணியின் அடித்தளம் மிக மெல்லியது
    cups_too_tight:
      name: கப்புகள் மிகவும் இறுக்கமாக உள்ளன
      description: கப்புகள் மார்பை அசௌகரியமாக அழுத்துகின்றன அல்லது இறுக்குகின்றன.
    too_short:
      description: எதிர்பார்த்த பொருத்தம், இடம் அல்லது பயன்பாட்டுக்கு உருப்படியின்
        நீளம் போதுமானதாக இல்லை.
      name: நீளம் மிகக் குறைவு
    difficult_to_use:
      description: உருப்படியை இயக்க எதிர்பார்த்ததைவிட அதிகத் திறமை அல்லது முயற்சி
        தேவைப்படுகிறது.
      name: பயன்படுத்துவது கடினம்
    doesnt_fit_bed_frame:
      description: மெத்தை அல்லது படுக்கை விரிப்புகளின் அளவுகள் குறிப்பிட்ட கட்டில்
        சட்டத்தின் அளவுக்குப் பொருந்தவில்லை.
      name: கட்டில் சட்டகத்திற்குப் பொருந்தவில்லை
    cuff_too_big:
      name: கைப்பட்டை மிகவும் பெரிதாக உள்ளது
      description: மணிக்கட்டு அல்லது கைக்கான திறப்பு மிகவும் தளர்வாக உள்ளது.
    unknown:
      name: தெரியவில்லை
      description: ரிட்டர்னுக்கான காரணம் குறிப்பிடப்படவில்லை அல்லது கண்டறிய முடியவில்லை.
    product_leaks:
      name: தயாரிப்பில் கசிவு உள்ளது
      description: கொள்கலன் அல்லது உருப்படி அதில் உள்ளவற்றைக் கசியாமல் வைத்திருக்கவில்லை.
    charging_speed:
      name: சார்ஜ் ஆகும் வேகம்
      description: சாதனத்தின் பேட்டரியைச் சார்ஜ் செய்ய அதிக நேரம் ஆகிறது.
    weather:
      description: சுற்றுச்சூழல் நிலைமைகள் சேவை அல்லது செயல்பாடு நடைபெறுவதைத் தடுக்கின்றன.
      name: வானிலை
    application:
      description: தயாரிப்பைப் பூசும் முறையில் சிறிய தவறும் பாதிப்பை ஏற்படுத்துகிறது,
        முறை மிகவும் சிக்கலாக உள்ளது அல்லது பயன்படுத்துபவர் தவறு செய்ய வாய்ப்புள்ளது.
      name: பூசும் முறை
    difficulty_level:
      name: கடினத்தன்மையின் அளவு
      description: உருப்படி அளிக்கும் சவால் பயனரின் திறனுக்கு ஏற்றதாக இல்லை.
    results_time:
      name: பலன் கிடைக்கும் நேரம்
      description: முடிவைப் பெறுவதற்கான நேரம் எதிர்பார்த்ததைவிட அதிகமாகவோ குறைவாகவோ
        உள்ளது.
    not_suitable_for_skin_type:
      name: சரும வகைக்கு ஏற்றதல்ல
      description: தயாரிப்பு பயனரின் சருமத்தில் எரிச்சலை ஏற்படுத்துகிறது அல்லது பலனளிக்கவில்லை.
    wrong_hand:
      name: பயன்படுத்தும் கைக்கு ஏற்றதல்ல
      description: வாடிக்கையாளருக்குத் தேவையான கைக்குப் பதிலாக எதிர்க் கையால் பயன்படுத்தும்
        வகையில் உருப்படி வடிவமைக்கப்பட்டுள்ளது (இடது அல்லது வலது).
    installation:
      name: நிறுவுதல்
      description: உருப்படியை நிறுவுவது அல்லது பொருத்துவது எதிர்பார்த்ததைவிடக் கடினமாக
        அல்லது சிக்கலாக உள்ளது.
    blade_type:
      description: கத்தியின் குறிப்பிட்ட வடிவம் அல்லது வெட்டு விளிம்பு வாடிக்கையாளரின்
        பயன்பாட்டுக்கு ஏற்றதாக இல்லை.
      name: பிளேடு வகை
    flex:
      description: உருப்படி வளைந்து மீண்டும் இயல்புநிலைக்குத் திரும்பும் விதம் பயனரின்
        தேவைகளுக்கு அல்லது பாணிக்கு ஏற்றதாக இல்லை.
      name: வளையும் தன்மை
    loose_around_thighs:
      description: ஆடை தொடைப் பகுதியில் சரியாகப் பொருந்தவில்லை.
      name: தொடைகளில் தளர்வாக உள்ளது
    animal_refused:
      name: விலங்கு ஏற்க மறுத்தது
      description: விலங்கு தயாரிப்பைப் பயன்படுத்தவோ உட்கொள்ளவோ மறுத்தது.
    battery_life:
      description: ஒருமுறை சார்ஜ் செய்தபின் சாதனம் இயங்கும் நேரம் வாடிக்கையாளர் எதிர்பார்த்தபடி
        இல்லை.
      name: பேட்டரி நீடிக்கும் நேரம்
    too_stiff:
      name: மிகவும் விறைப்பாக உள்ளது
      description: உருப்படி அல்லது அதன் கூறுகள் மிகவும் விறைப்பாக இருப்பதால், பயன்படுத்தவுள்ள
        நோக்கத்திற்குத் தேவையானபடி வளைக்கவோ நெகிழச் செய்யவோ வடிவத்தை மாற்றவோ முடியவில்லை.
    longevity:
      name: நீடித்து உழைக்கும் தன்மை
      description: தயாரிப்பின் விளைவு நீடிக்கும் நேரம் எதிர்பார்த்ததைவிடக் குறைவாக
        அல்லது அதிகமாக உள்ளது.
    heel_too_high:
      name: குதிகால் பகுதி மிகவும் உயரமாக உள்ளது
      description: குதிகால் பகுதியின் உயரம் சௌகரியமாக அல்லது விருப்பத்துக்கு ஏற்றதாக
        இல்லாமல் மிகவும் அதிகமாக உள்ளது.
    laptop_fit:
      description: பையின் அறை அல்லது உறை வாடிக்கையாளரின் மடிக்கணினி அளவுக்குப் பொருந்தவில்லை.
      name: மடிக்கணினிக்கான பொருத்தம்
    logo_peeling:
      name: லோகோ உரிகிறது
      description: உருப்படியில் அச்சிடப்பட்ட அல்லது ஒட்டப்பட்ட பிராண்டிங் உரிந்து
        வருகிறது.
    terrain:
      description: தரைப்பரப்பின் வகை அல்லது நிலைமைகள் உருப்படியின் திறன்களுக்கு ஏற்றதாக
        இல்லை.
      name: நிலப்பரப்பு
    ingredients:
      name: சேர்மானங்கள்
      description: வாடிக்கையாளர் தவிர்க்க விரும்பும் கூறுகள் தயாரிப்பில் உள்ளன.
    washability:
      name: துவைக்க ஏற்ற தன்மை
      description: சுத்தம் செய்ய வேண்டிய முறை ஏற்கத்தக்கதாக இல்லை.
    readability:
      description: உருப்படியில் உள்ள உரை அல்லது காட்சியைப் பார்ப்பது அல்லது புரிந்துகொள்வது
        கடினமாக உள்ளது.
      name: படிக்க எளிதாக இருத்தல்
    thickness:
      description: உருப்படியின் தடிமன் அல்லது கட்டமைப்பு எதிர்பார்த்ததைவிடப் பருமனாக
        அல்லது மெலிதாக உள்ளது.
      name: தடிமன்
    product_overheats:
      name: தயாரிப்பு அதிகமாகச் சூடாகிறது
      description: சாதனம் இயங்கும்போது பாதுகாப்பற்ற அல்லது அசௌகரியத்தை ஏற்படுத்தும்
        அளவுக்கு வெப்பமடைகிறது.
    damaged_after_wear:
      description: உடலில் அணிந்து பயன்படுத்திய பிறகு உருப்படியில் சேதத்தின் அறிகுறிகள்
        தெரிகின்றன.
      name: அணிந்த பிறகு சேதமடைந்தது
    pockets_too_shallow:
      description: உருப்படிகளைப் பாதுகாப்பாக வைக்கச் சேமிப்பு அறைகளின் ஆழம் போதுமானதாக
        இல்லை.
      name: பாக்கெட்டுகளின் ஆழம் மிகவும் குறைவு
    bounce:
      name: துள்ளும் தன்மை
      description: உருப்படியின் துள்ளும் திறன் அந்தச் செயல்பாட்டுக்கு மிக அதிகமாகவோ
        மிகக் குறைவாகவோ உள்ளது.
    item_not_as_described:
      description: பட்டியலில் வழங்கப்பட்ட விளக்கம், படங்கள் அல்லது விவரக்குறிப்புகளுக்குத்
        தயாரிப்பு பொருந்தவில்லை.
      name: விவரித்தபடி உருப்படி இல்லை
    type_too_small:
      description: எழுத்துரு அல்லது எழுத்தின் அளவு எளிதாகப் படிக்க முடியாத அளவுக்குச்
        சிறிதாக உள்ளது.
      name: எழுத்தளவு மிகவும் சிறியது
    artificial_tasting:
      description: சுவை இயற்கையாக இல்லாமல் செயற்கையாக உள்ளது.
      name: செயற்கையான சுவை
    straps_too_long:
      name: பட்டைகள் மிகவும் நீளமாக உள்ளன
      description: பட்டைகள் அதிக நீளமாக இருப்பதால் சரியாகப் பொருத்தவோ சரிசெய்யவோ சிரமமாக
        உள்ளது.
    bust_too_loose:
      description: மார்புப் பகுதியில் போதுமான அளவு உறுதியாகப் பொருந்தவில்லை.
      name: மார்புப் பகுதி மிகவும் தளர்வாக உள்ளது
    budget:
      description: சேவையின் செலவு வாடிக்கையாளர் செலவிடக்கூடிய வரம்பை மீறுகிறது.
      name: செலவு வரம்பு
    language:
      name: மொழி
      description: உரை அல்லது ஒலியின் மொழி வாடிக்கையாளருக்குத் தேவையான மொழியாக இல்லை.
    embellishment_fell_off:
      name: அலங்காரப் பொருள் கழன்று விழுந்தது
      description: உருப்படியிலிருந்து அலங்காரப் பகுதிகள் கழன்றுவிட்டன.
    material:
      description: உருப்படி செய்யப்பட்டுள்ள பொருள் அல்லது துணியின் தொடு உணர்வு, நீடித்து
        உழைக்கும் தன்மை அல்லது கலவை வாடிக்கையாளரின் விருப்பத்துக்கு ஏற்றதாக இல்லை.
      name: தயாரிப்புப் பொருள்
    collar_too_loose:
      description: காலர் கழுத்தைச் சுற்றி உறுதியாகப் பொருந்தவில்லை.
      name: காலர் மிகவும் தளர்வாக உள்ளது
    skin_tone:
      name: சரும நிறம்
      description: வாடிக்கையாளரின் சரும நிறத்திற்கு இந்த நிறம் பொருந்தவில்லை.
    too_small:
      name: மிகவும் சிறிதாக உள்ளது
      description: வாடிக்கையாளருக்குத் தேவையான பொருத்தம் அல்லது இடத்தைவிட உருப்படியின்
        அளவுகள் சிறியதாக உள்ளன.
    height:
      description: உருப்படியின் உயரம் வாடிக்கையாளரிடம் உள்ள இடத்துக்கு அல்லது உடலுக்கு
        ஏற்ற பயன்பாட்டுத் தேவைகளுக்குப் பொருந்தவில்லை.
      name: உயரம்
    amperage:
      name: மின்னோட்ட அளவு
      description: மின்னோட்ட மதிப்பீடு வாடிக்கையாளரின் சாதனம் அல்லது அமைப்பின் தேவைகளுக்கு
        ஏற்றதாக இல்லை.
    too_big:
      name: மிகவும் பெரிதாக உள்ளது
      description: வாடிக்கையாளருக்குத் தேவையான பொருத்தம் அல்லது இடத்தைவிட உருப்படியின்
        அளவுகள் பெரியதாக உள்ளன.
    not_suitable_for_hair_type:
      name: முடி வகைக்கு ஏற்றதல்ல
      description: தயாரிப்பு பயனரின் தலைமுடியில் பலனளிக்கவில்லை அல்லது விரும்பத்தகாத
        விளைவை ஏற்படுத்துகிறது.
    water_resistance:
      name: நீர் எதிர்ப்புத் திறன்
      description: உருப்படியின் நீர் அல்லது ஈரத்தை எதிர்க்கும் திறன், திட்டமிட்ட பயன்பாட்டுச்
        சூழலுக்குப் போதுமானதாக இல்லை.
    adhesive_strength:
      description: எதிர்பார்த்த சுமை அல்லது அழுத்தத்தைத் தாங்குவதற்குப் பசையின் பிடிப்புத்திறன்
        போதுமானதாக இல்லை அல்லது அதிகமாக உள்ளது.
      name: ஒட்டும் வலிமை
    warmth:
      name: கதகதப்பு
      description: உருப்படி வழங்கும் அல்லது தக்கவைக்கும் வெப்பத்தின் அளவு, பயன்படுத்தவுள்ள
        சூழலுக்கோ செயல்பாட்டிற்கோ ஏற்றதாக இல்லை.
    prescription_processed_incorrectly:
      description: உருப்படியில் செயல்படுத்தப்பட்ட தனிப்பட்ட மருத்துவப் பரிந்துரை வாடிக்கையாளரின்
        ஆர்டர் விவரக்குறிப்புகளுக்குப் பொருந்தவில்லை.
      name: மருத்துவப் பரிந்துரை தவறாகச் செயலாக்கப்பட்டது
    grip:
      name: பிடிப்பு
      description: உருப்படியின் மேற்பரப்புத் தன்மை வாடிக்கையாளருக்குத் தேவையான கட்டுப்பாட்டையோ
        நிலைத்தன்மையையோ வழங்கவில்லை.
    color_too_bright:
      name: நிறம் மிகவும் பிரகாசமாக உள்ளது
      description: நிறத்தின் தீவிரம் அல்லது பளிச்சிடும் தன்மை வாடிக்கையாளரின் விருப்பத்திற்கு
        ஏற்றதைவிட அதிகமாக உள்ளது.
    stuffing:
      description: உள்ளே நிரப்பப்பட்ட பொருளின் அளவு அல்லது வகை போதுமானதாக இல்லை அல்லது
        அசௌகரியமாக உள்ளது.
      name: நிரப்புப் பொருள்
    burn_rate:
      description: உருப்படி எரிந்து தீரும் வேகம் எதிர்பார்த்ததைவிட அதிகமாக அல்லது
        குறைவாக உள்ளது.
      name: எரியும் வேகம்
    recoil:
      name: பின்னுதைப்பு
      description: சாதனத்தின் பின்னோக்கிய அசைவு அல்லது பின்னுதைப்பு, வாடிக்கையாளர்
        சிரமமின்றிக் கையாளக்கூடிய அளவைவிட அதிகமாக உள்ளது.
    eye_strain:
      name: கண் சோர்வு
      description: தயாரிப்பைப் பயன்படுத்துவது கண்களில் சோர்வு அல்லது அசௌகரியத்தை ஏற்படுத்துகிறது.
    content:
      description: உருப்படியில் உள்ள தகவல் அல்லது உள்ளடக்கம் வாடிக்கையாளர் எதிர்பார்த்தபடி
        இல்லை.
      name: உள்ளடக்கம்
    adhesion:
      description: ஒட்ட நினைத்த மேற்பரப்பில் தயாரிப்பு ஆரம்பத்திலேயே உறுதியாக ஒட்டவில்லை.
      name: ஒட்டும் திறன்
    inseam_too_short:
      description: ஆடையின் உள்கால் நீளம் வாடிக்கையாளரின் கால் நீளத்துக்குப் போதுமானதாக
        இல்லை.
      name: உள்கால் நீளம் மிகக் குறைவு
    packaging_not_sealed:
      name: பொதியாக்கம் சீல் செய்யப்படவில்லை
      description: தயாரிப்பு வந்தபோது அதன் பொதி திறந்திருந்தது அல்லது திறந்து மாற்றப்பட்டிருந்தது.
    firmness:
      description: உருப்படியின் கடினத்தன்மை அல்லது அழுத்தும்போது அமுங்கும் தன்மை எதிர்பார்த்தபடி
        இல்லை.
      name: கெட்டித்தன்மை
    cleaning:
      name: சுத்தம் செய்தல்
      description: உருப்படி எதிர்பார்த்த அளவுக்கு எளிதாகச் சுத்தமாவதில்லை.
    viscosity:
      name: பாகுத்தன்மை
      description: திரவத்தின் அடர்த்தி அல்லது ஓட்ட எதிர்ப்பு திட்டமிட்ட பயன்பாட்டிற்குப்
        பொருந்தவில்லை.
    pockets_too_deep:
      description: சேமிப்பு அறைகளின் ஆழம் காரணமாக உருப்படிகளை எடுப்பது கடினமாக உள்ளது.
      name: பாக்கெட்டுகள் மிகவும் ஆழமாக உள்ளன
    uncomfortable_in_ear:
      description: காதில் பொருத்தும் பகுதியின் பொருத்தம் அல்லது வடிவம் எரிச்சலை அல்லது
        வலியை ஏற்படுத்துகிறது.
      name: காதில் அசௌகரியமாக உள்ளது
    pressure:
      description: உருப்படியிலிருந்து வெளிவரும் ஓட்டத்தின் அழுத்தம் மிகவும் அதிகமாக
        அல்லது குறைவாக உள்ளது.
      name: அழுத்தம்
    magnification_too_strong:
      description: அளவுக்கு அதிகமாகப் பெரிதாக்கிக் காட்டுவதால் காட்சி திரிபடைகிறது
        அல்லது அசௌகரியம் ஏற்படுகிறது.
      name: உருப்பெருக்கம் மிக அதிகம்
    caffeine_level:
      name: கஃபீன் அளவு
      description: தயாரிப்பில் உள்ள கஃபீன் செறிவு பயனருக்கு மிக அதிகமாகவோ குறைவாகவோ
        உள்ளது.
    duration:
      description: சேவை, நிகழ்வு அல்லது அணுகலுக்காக ஒதுக்கப்பட்ட காலம் எதிர்பார்த்ததைவிடக்
        குறைவாக அல்லது அதிகமாக உள்ளது.
      name: கால அளவு
    softness:
      name: மென்மை
      description: உருப்படியைத் தொடும்போது உணரப்படும் மென்மை அல்லது மெத்தென்ற தன்மை
        வாடிக்கையாளரின் விருப்பத்திற்குப் பொருந்தவில்லை.
    too_bitter:
      name: மிகவும் கசப்பாக உள்ளது
      description: சுவை விரும்பத்தகாத அளவுக்குக் கடுமையாகவோ கசப்பாகவோ உள்ளது.
    maneuverability:
      description: உருப்படியை நகர்த்துவது, திசைதிருப்புவது அல்லது கையாள்வது வாடிக்கையாளருக்குத்
        தேவையான அளவு எளிதாக இல்லை.
      name: கையாளும் எளிமை
    provider_unavailable:
      name: சேவை வழங்குநர் கிடைக்கவில்லை
      description: சேவை வழங்குநரால் விரும்பிய நேரத்தில் அல்லது இடத்தில் கோரிக்கையை
        நிறைவேற்ற முடியவில்லை.
    field_of_view:
      description: ஒளியியல் சாதனம் காட்டும் பார்வைப் பரப்பு அதன் பயன்பாட்டு நோக்கத்துக்கு
        ஏற்றதாக இல்லை.
      name: பார்வைப் பரப்பு
    ripeness:
      name: பழுத்த நிலை
      description: விளைபொருள் உண்பதற்கு ஏற்ற வகையில் விரும்பிய பக்குவத்தில் இல்லை.
    fit:
      description: உடல் அல்லது பிற உபகரணங்களின் மீது, உள்ளே அல்லது அவற்றை ஒட்டி உருப்படி
        அமையும் விதம் சரியாக இல்லை
      name: பொருத்தம்
    piece_size:
      name: துண்டின் அளவு
      description: தொகுப்பில் உள்ள தனித்தனிக் கூறுகள் குறிப்பிட்ட பயன்பாட்டுக்கு மிகவும்
        பெரியதாகவோ மிகவும் சிறியதாகவோ உள்ளன.
    legs_too_tight:
      description: ஆடையின் கால் பகுதிகள் இறுக்கமாக இருந்து அசைவைக் கட்டுப்படுத்துகின்றன
        அல்லது அசௌகரியத்தை ஏற்படுத்துகின்றன.
      name: கால் பகுதிகள் மிகவும் இறுக்கமாக உள்ளன
    shade:

---
layout: default
---

{% include header.html %}
<div class="attribute-search-wrapper">
  <div class="search-container">
    <label for="disclosure-search" class="search-container__label">Disclosure Search:</label>
    <input class="search-container__input" type="text" id="disclosure-search" placeholder="Loading…">
    <ul class="search-container__ul" id="disclosure-search-results"></ul>
  </div>
</div>
{% comment %} Filled by disclosure_release.js from disclosure_data/ (see _plugins/release_data.rb) {% endcomment %}
<div class="disclosure-container hidden" id="disclosure-detail">
  <div class="column">
    <div class="box">
      <div class="value-container">
        <h3 class="disclosure-detail__name"></h3>
        <div class="value-container__id">
          <span class="id disclosure-detail__id"></span>
        </div>
        <div class="disclosure-detail__children">
          <ul class="values-container__list"></ul>
        </div>
      </div>
    </div>
  </div>
  <div class="column">
    <div class="box">
      <div class="categories-container">
        <h3>Details</h3>
        <div>
          <ul class="values-container__list disclosure-detail__details"></ul>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="{{ site.baseurl }}/assets/js/disclosure_release.js"></script>

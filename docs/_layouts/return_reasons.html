---
layout: default
---

{% include header.html %}
<div class="attribute-search-wrapper">
  <div class="search-container">
    <label for="return-reason-search" class="search-container__label">Return Reason Search:</label>
    <input class="search-container__input" type="text" id="return-reason-search" placeholder="Loading…">
    <ul class="search-container__ul" id="return-reason-search-results"></ul>
  </div>
</div>
{% comment %} Filled by return_reason_release.js from return_reason_data/ (see _plugins/release_data.rb) {% endcomment %}
<div class="return-reason-container hidden" id="return-reason-detail">
  <div class="column">
    <div class="return-reasons-wrapper box">
      <div class="value-container return-reason-values">
        <h3 class="return-reason-detail__name"></h3>
        <div class="value-container__id">
          <span class="id return-reason-detail__id"></span>
        </div>
        <div class="return-reason-description-wrapper">
          <p class="return-reason-description"></p>
        </div>
      </div>
    </div>
  </div>
  <div class="column">
    <div class="return-reason-categories-wrapper box">
      <div class="categories-container return-reason-categories">
        <h3>
          Categories
        </h3>
        <div>
          <ul class="values-container__list return-reason-detail__categories"></ul>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="{{ site.baseurl }}/assets/js/return_reason_release.js"></script>

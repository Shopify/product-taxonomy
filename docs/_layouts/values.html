---
layout: default
---

{% include header.html %}
<div class="attribute-search-wrapper">
  <div class="search-container">
    <label for="value-search" class="search-container__label">Value Search:</label>
    <input class="search-container__input" type="text" id="value-search" placeholder="Loading…">
    <ul class="search-container__ul" id="value-search-results"></ul>
  </div>
</div>
{% comment %} Filled by values.js from value_data/ (see _plugins/release_data.rb) {% endcomment %}
<div class="value-page-entry hidden" id="value-detail" data-attributes-url="{{ site.baseurl }}/releases/{{ page.target }}/attributes">
  <div class="column">
    <div class="value-wrapper box">
      <div class="value-container value-detail">
        <h3 class="value-detail__name"></h3>
        <div class="value-container__id">
          <span class="id value-detail__id"></span>
          <span class="id value-detail__handle"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="column">
    <div class="value-attribute-wrapper box">
      <div class="value-container value-attribute">
        <h3>Attribute</h3>
        <p class="value-detail__attribute"></p>
      </div>
    </div>
  </div>
</div>
<script type="module" src="{{ site.baseurl }}/assets/js/value_release.js"></script>
